version = 1

# REUSE licensing for the Arlen monorepo (licensing-strategy.md). The per-file
# SPDX headers are the long-term goal; this file licenses the tree in bulk by the
# per-component map so the repo is REUSE-compliant without a header on every one
# of ~2800 files. precedence = "closest" means a file that carries its OWN SPDX
# header always wins over the glob below - so lifted code keeps its upstream
# license (copy-policy.md) and per-file carve-outs (the gtk-layer-shell-derived
# layer_shell.rs, the Wayland protocol XMLs) keep theirs. Later blocks override
# earlier ones for an overlapping path, so the broad first-party rule comes first
# and the GPL-linked carve-outs come last.
#
# The copyright holder is Tim Kicker (the project author). Do NOT add the
# top-level LICENSE file here - that is a separate human-gated step.

# First-party Arlen code: the OS itself, copyleft + anti-SaaS.
[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Tim Kicker"
SPDX-License-Identifier = "AGPL-3.0-only"

# Wire/contract crates: permissive so the future closed store-backend can link
# them (patent grant). Wire types only.
[[annotations]]
path = "contracts/**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Tim Kicker"
SPDX-License-Identifier = "Apache-2.0"

# The eBPF kernel-layer: GPL-2.0-only (in-kernel eBPF must be GPL-compatible to
# use GPL-only kernel helpers; the workspace Cargo.toml already declares this).
[[annotations]]
path = "daemons/kernel-layer/**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Tim Kicker"
SPDX-License-Identifier = "GPL-2.0-only"

# The xdg-desktop-portal backend: GPL-3.0-only (links the GPL portal surface).
[[annotations]]
path = "daemons/xdg-portal/**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Tim Kicker"
SPDX-License-Identifier = "GPL-3.0-only"

# Tauri plugins + the input client: GPL-3.0-only (link GTK/WebKit GPL surfaces).
[[annotations]]
path = "sdk/tauri-plugin-clipboard/**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Tim Kicker"
SPDX-License-Identifier = "GPL-3.0-only"

[[annotations]]
path = "sdk/tauri-plugin-menu/**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Tim Kicker"
SPDX-License-Identifier = "GPL-3.0-only"

[[annotations]]
path = "sdk/tauri-plugin-portal/**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Tim Kicker"
SPDX-License-Identifier = "GPL-3.0-only"

[[annotations]]
path = "sdk/tauri-plugin-shell/**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Tim Kicker"
SPDX-License-Identifier = "GPL-3.0-only"

[[annotations]]
path = "sdk/arlen-input-client/**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Tim Kicker"
SPDX-License-Identifier = "GPL-3.0-only"

# The vendored adw-gtk3 fork (themes/adw-gtk3/README.md carries the provenance).
# Upstream states its licence in `meson.build` (`license: ['LGPL2.1']`) and ships
# the LGPL-2.1 text, with no per-file headers and no copyright line anywhere in
# the tree - so the holder is recorded as the project's authors, which is as
# specific as upstream itself is, and the identifier is the "only" form because
# nothing upstream says "or later" and understating their grant is the safe
# direction. Without this block the `**` rule above would have declared somebody
# else's LGPL source as our AGPL, which is the actual defect here; the unused
# `LICENSES/LGPL-2.1-only.txt` was only how it surfaced.
#
# One block for the whole directory, our three files included: `arlen.scss` and
# `arlen-dark.scss` are derived from upstream's entry points and
# `_all-widgets.scss` is upstream's own module list lifted out, so all three are
# LGPL work with our modifications on top rather than fresh first-party code.
[[annotations]]
path = "themes/adw-gtk3/**"
precedence = "closest"
SPDX-FileCopyrightText = ["The adw-gtk3 authors", "2026 Tim Kicker"]
SPDX-License-Identifier = "LGPL-2.1-only"

# The stock Tauri application icons. `tauri init` writes this set into every
# `src-tauri/icons/`, and no app has replaced it: all seventeen directories are
# byte-identical artwork (the shell keeps the full sixteen-file set including the
# `Square*Logo` tiles, the other apps the five-file subset). It is the Tauri
# Programme's logo, not ours, and the `**` rule above was declaring copyright we
# do not hold - which on artwork is the one place a bulk rule is not a harmless
# approximation. Tauri is dual-licensed Apache-2.0 OR MIT; MIT is named here as
# the narrower of the two we rely on.
#
# This is a truthful declaration, NOT a decision to keep the mark. Replacing the
# artwork is a separate step and is Tim's; a sidecar is not a substitute for it
# and is also not something to postpone until we do, because a lint passing on a
# false answer is worse than one that fails.
#
# Listed directory by directory rather than as `apps/*/src-tauri/icons/**`: a
# glob that silently matched nothing would be exactly the false answer this block
# exists to remove, and a new app's icons are meant to need a line here.
[[annotations]]
path = [
    "apps/calendar/src-tauri/icons/**",
    "apps/clock/src-tauri/icons/**",
    "apps/desktop-shell/src-tauri/icons/**",
    "apps/files/src-tauri/icons/**",
    "apps/greeter/src-tauri/icons/**",
    "apps/harness/src-tauri/icons/**",
    "apps/knowledge/src-tauri/icons/**",
    "apps/mail/src-tauri/icons/**",
    "apps/meetings/src-tauri/icons/**",
    "apps/pdf/src-tauri/icons/**",
    "apps/screenshot/src-tauri/icons/**",
    "apps/settings/src-tauri/icons/**",
    "apps/store/src-tauri/icons/**",
    "apps/system-monitor/src-tauri/icons/**",
    "apps/terminal/src-tauri/icons/**",
    "apps/text-editor/src-tauri/icons/**",
    "apps/viewers/src-tauri/icons/**",
    "daemons/xdg-portal/picker-ui/src-tauri/icons/**",
    "apps/greeter/static/favicon.png",
    "apps/harness/static/favicon.png",
    "apps/terminal/static/favicon.png",
]
precedence = "closest"
SPDX-FileCopyrightText = "Tauri Programme within The Commons Conservancy"
SPDX-License-Identifier = "MIT"

# The SvelteKit template favicon: the Svelte logo, written by `create-svelte` and
# never replaced. Same shape of claim as the Tauri icons above and the same
# answer - it is their mark, declared as theirs. Svelte ships MIT.
[[annotations]]
path = [
    "apps/desktop-shell/static/favicon.png",
    "sdk/ui-kit/static/favicon.png",
]
precedence = "closest"
SPDX-FileCopyrightText = "The Svelte contributors"
SPDX-License-Identifier = "MIT"

# Screenshots of our own surfaces, taken in the verification VM. First-party by
# construction: every pixel is this project's UI. Declared explicitly rather than
# left to the catch-all because a picture is exactly where the catch-all stops
# being an approximation - the rule is that artwork is named, and these are ours
# to name.
[[annotations]]
path = "dev/vm/**.png"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Tim Kicker"
SPDX-License-Identifier = "AGPL-3.0-only"

# Codec test fixtures. Synthetic minimal encodes - a few hundred bytes each, a
# handful of pixels - made to exercise a decoder, not photographs of anything.
# Nothing was lifted: at that size there is nothing to lift.
[[annotations]]
path = [
    "ai/ai-sandbox/test-fixtures/**",
    "apps/files/core/test-fixtures/**",
    "apps/viewers/decode-heic/tests/fixtures/**",
    "apps/viewers/decode-jxl/tests/fixtures/**",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Tim Kicker"
SPDX-License-Identifier = "AGPL-3.0-only"
