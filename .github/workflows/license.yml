name: license

# License hygiene (licensing-strategy.md): gate the dependency tree's licenses
# with cargo-deny and run the REUSE/SPDX lint, via `just lint-licenses`. Separate
# from ci.yml so the license gate is independent of the build matrix. cargo-deny
# only resolves the dependency graph (no compilation), so this is cheap. The first
# run reconciles deny.toml's allowlist against the real resolved tree; `reuse lint`
# gates against REUSE.toml, which licenses the tree by the per-component map.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: license-${{ github.ref }}
  cancel-in-progress: true

jobs:
  licenses:
    name: license hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Pin cargo-deny: 0.20.2 takes --config as a top-level option (what the
      # lint-licenses recipe passes). An unpinned "latest" drifted to a version
      # that wants `check --config`, which broke the recipe.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2,just
      - name: install reuse
        run: pipx install reuse
      - name: lint-licenses
        run: just --justfile dev/justfile lint-licenses

  notices:
    name: third-party notices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: install cargo-bundle-licenses
        run: cargo install cargo-bundle-licenses --locked
      # The invocation HAS now been reconciled on a host with the tool (17
      # August): cargo-bundle-licenses takes no path argument, and the recipe
      # had been passing `--manifest-path`, which it rejects outright. So this
      # produced nothing from the day it was written, and said success anyway -
      # `continue-on-error` here plus `if-no-files-found: ignore` below meant a
      # green run with `##[error] exit code 2` in its own log and zero
      # artifacts attached.
      #
      # Still non-gating, for a reason that is now about cost rather than doubt:
      # the recipe walks 118 workspace roots and resolves each one's dependency
      # graph, so a transient registry hiccup anywhere in that walk would fail a
      # workflow whose output is an informational artifact. The recipe itself
      # now refuses to finish empty, so a silent nothing cannot come back.
      - name: generate notices
        continue-on-error: true
        run: just --justfile dev/justfile notices
      - uses: actions/upload-artifact@v4
        with:
          name: third-party-notices
          path: THIRD-PARTY-NOTICES/
          if-no-files-found: warn
