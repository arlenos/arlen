name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # lbug (Kuzu) vendors thrift C++ that misses <cstdint> on newer GCC.
  CXXFLAGS: "-include cstdint"
  # Keep the target dir small: the knowledge build is disk-heavy enough to
  # crash the linker on a default runner. CI needs neither debug symbols nor
  # incremental rebuilds.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  # Decide which components actually need building. The common case (editing one
  # crate) then runs only that crate's leg instead of all of them. A change to
  # anything shared falls back to the full matrix so a contract or lockfile
  # change still rebuilds every dependent: rust goes full on a Cargo lockfile/
  # manifest, the toolchain, .cargo, .github, contracts/, or any sdk/ crate
  # except sdk/ui-kit; frontend goes full on .github or sdk/ui-kit (the shared
  # component library). When the diff base is unknown (a new branch, a
  # force-push, the first run) or the run was triggered manually both go full,
  # which is the safe default.
  changes:
    name: detect changed components
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.detect.outputs.rust }}
      rust_touched: ${{ steps.detect.outputs.rust_touched }}
      frontend: ${{ steps.detect.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The matrix below is hand-kept and its comment claims every [package] is
      # listed. Nothing checked that, and the justfile copy of the same list had
      # already fallen nine crates behind. Runs here because this job is
      # unconditional: drift can arrive in a commit that touches no rust at all.
      # The catalog gate compiles every MessageFormat source string, so it needs
      # the same formatter the UI runs. This job has no app node_modules and node
      # resolves a bare import from the importing file, so install that one
      # package at the version the apps declare. Deliberately not made skippable:
      # a gate that goes quiet when its dependency is missing is a gate that stops
      # running the day someone changes the layout, and nobody finds out.
      - name: messageformat for the catalog gate
        run: |
          want=$(node -e "console.log(require('./sdk/ui-kit/package.json').dependencies.messageformat)")
          echo "installing messageformat@$want (as declared by sdk/ui-kit)"
          # --prefix is not optional: with no package.json at the repo root npm
          # walks UP to the nearest one and installs there instead, which on a
          # developer machine is $HOME and here would be wherever the runner's
          # checkout sits. Pin it to the checkout so the gate's resolution finds it.
          npm install --prefix "$PWD" --no-save --no-audit --no-fund "messageformat@$want"
          node -e "require('./node_modules/messageformat/package.json')" \
            || { echo "messageformat did not land in the checkout"; exit 1; }
      - name: structural checks
        # The seven build-free checks, run directly rather than through `just`,
        # which the runner does not have. Each is deterministic file reading with
        # no network and no build, and each guards something that had already
        # drifted once: the matrix against the tree, an ignore rule against what
        # is tracked, a unit ordering against a unit that exists, the eight copies
        # of event.proto against each other, and this workflow against the
        # justfile on how a listed crate is actually built, and a shared file's
        # reader against its writer. Seconds, together.
        run: |
          python3 dev/scripts/check-crate-coverage.py
          python3 dev/scripts/check-proto-drift.py
          python3 dev/scripts/check-gate-drift.py
          python3 dev/scripts/check-shared-files.py
          python3 dev/scripts/check-smoke-coverage.py
          python3 dev/scripts/check-executor-gate.py
          python3 dev/scripts/check-shipped-units.py
          node dev/scripts/check-catalogs.mjs
          node dev/scripts/check-i18n-reactivity.mjs
          python3 dev/scripts/check-invoke-shape.py
          node dev/scripts/test-check-fixtures.mjs
          bash dev/scripts/check-packaged-units.sh
          tracked=$(git ls-files --ignored --exclude-standard -c)
          if [ -n "$tracked" ]; then
            echo "tracked, yet matched by an ignore rule:"
            printf '  %s\n' $tracked
            exit 1
          fi
          echo "no tracked file is matched by an ignore rule"
      - id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Deliberately NOT in RUST_ALL, so nobody "closes the gap" into a red build:
          #   apps/*/src-tauri  - see below; the stated reasons no longer hold, so the
          #                       fence is a build-time choice now, not a hard block
          #   daemons/kernel-layer/* - need the bpf toolchain / a VM
          #
          # On `apps/*/src-tauri`: the reason recorded here was webkit2gtk + the tauri
          # toolchain, plus `cosmic-comp-config` for settings. Both are stale. This
          # job already installs `libwebkit2gtk-4.1-dev`, `libgtk-3-dev` and
          # `libsoup-3.0-dev` (see the system-deps step), and `apps/settings/src-tauri`
          # builds and tests on a plain host today - its `cosmic-comp-config` git dep
          # resolves. `apps/desktop-shell/src-tauri` builds and runs its 350 tests too.
          #
          # So what keeps them out is BUILD TIME, not capability, and that is worth
          # deciding on purpose: those 350 shell tests never run in CI, which is how a
          # test that failed under the default parallel runner stayed "a known flake"
          # for as long as it did. The matrix is path-filtered, so adding one would
          # only cost on commits that touch it.
          # Everything else that defines a [package] IS listed. Same rule for FRONT_ALL:
          # every package.json declaring a `test` script is listed.
          RUST_ALL='["contracts/audit-proto","contracts/notification-proto","contracts/modulesd-proto","contracts/ai-engine-contract","contracts/graph-schema","contracts/forage-recipe","contracts/capsule","contracts/artifact","contracts/file-change","contracts/lenv","contracts/run-consent-token","contracts/consent-contract","contracts/extensions","contracts/transcript","contracts/meeting-note","contracts/freedesktop-trash","sdk","sdk/secret-vault","sdk/config-format","sdk/i18n","ai","daemons/event-bus","daemons/knowledge","daemons/notification-daemon","daemons/audit-daemon","daemons/anomaly-detector","daemons/modulesd","daemons/installd","daemons/knowledge-mcp","daemons/file-manager-mcp","daemons/system-monitor-mcp","daemons/xdg-portal","daemons/capsuled","daemons/arlen-run","daemons/online-accounts","daemons/connections","daemons/power-daemon","daemons/journald-parser","daemons/code-indexer","daemons/print","daemons/transfer-daemon","daemons/lock-auth","daemons/wallpaper","daemons/integration-packages","daemons/bridge-ingest","daemons/consent-broker","daemons/config-broker","daemons/settings-broker","daemons/ai-engine-daemon","daemons/terminal-run-mcp","daemons/sentinel-detect","store-backend","apps/trash-rm/core","apps/trash-rm/cli","forage","forage/store","forage/fetch","forage/build","forage/package","forage/extract","forage/pipeline","forage/signing","forage/patch","forage/capabilities","forage/cookbook-index","forage/cookbook-sign","forage/cookbook-registry","forage/cookbook-resolve","forage/bridge-install","apps/terminal/core","apps/terminal/engine","apps/files/core","apps/viewers/core","apps/viewers/decode-image","apps/viewers/decode-jxl","apps/viewers/decode-heic","apps/viewers/host","apps/viewers/decode-audio","apps/greeter/core","apps/system-monitor/core","apps/settings/core","apps/screenshot/core","apps/meetings/core","apps/desktop-shell/core","dev/integration","dev/dogfood","dev/event-emit","dev/ai-drive"]'
          FRONT_ALL='["sdk/module-sdk","apps/knowledge","daemons/xdg-portal/picker-ui","apps/settings","apps/harness","apps/desktop-shell","apps/terminal","apps/files","apps/greeter","apps/meetings","apps/system-monitor","apps/text-editor","apps/screenshot","apps/store","apps/viewers","sdk/ui-kit","ai/pi-plugins"]'

          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE"; head="$PR_HEAD"
          else
            base="$BEFORE"; head="$SHA"
          fi

          base_unknown=0
          # A manual dispatch has no diff base; run the full matrix.
          [ "$EVENT_NAME" = "workflow_dispatch" ] && base_unknown=1
          changed=""
          if [ "$base_unknown" = "1" ] || [ -z "$base" ] || echo "$base" | grep -qE '^0+$'; then
            base_unknown=1
          else
            changed="$(git diff --name-only "$base" "$head" 2>/dev/null || true)"
            [ -z "$changed" ] && base_unknown=1
          fi

          rust_full=$base_unknown
          frontend_full=$base_unknown
          if [ "$base_unknown" = "0" ]; then
            if grep -qE '^(Cargo\.(lock|toml)|rust-toolchain|\.cargo/|\.github/|contracts/)' <<< "$changed"; then
              rust_full=1
            fi
            # any sdk/ change except under sdk/ui-kit/ is a shared rust change
            if grep -E '^sdk/' <<< "$changed" | grep -qvE '^sdk/ui-kit/'; then
              rust_full=1
            fi
            if grep -qE '^(\.github/|sdk/ui-kit/)' <<< "$changed"; then
              frontend_full=1
            fi
          fi

          changed_json="$(printf '%s' "$changed" | jq -R . | jq -cs .)"
          # sdk/ui-kit lives under sdk/ but is a frontend component, not part of
          # the sdk rust workspace, so it must not pull in the sdk rust leg. The
          # rust subset matches against the change list with ui-kit paths removed.
          changed_rust="$(printf '%s' "$changed" | grep -vE '^sdk/ui-kit/' || true)"
          changed_rust_json="$(printf '%s' "$changed_rust" | jq -R . | jq -cs .)"

          if [ "$rust_full" = "1" ]; then
            rust="$RUST_ALL"
          else
            rust="$(printf '%s' "$changed_rust_json" | jq -c --argjson all "$RUST_ALL" \
              '. as $ch | $all | map(select(. as $c | $ch | any(startswith($c + "/"))))')"
          fi
          # dev/integration holds the tree-wide guards: unit identity, image
          # staging, proto agreement, D-Bus activation, both CI matrices, and
          # module/crate reachability. Every one of them asserts something about
          # OTHER crates, so selecting it by its own path meant it ran only when
          # someone edited a guard, never on the commit that broke what the guard
          # watches. A commit adding an unreferenced module to daemons/foo
          # selects daemons/foo alone, and the reachability guard sat it out.
          # Always run it. The cost is one small leg (its dev-deps are light
          # client crates, and the daemon scenarios stay #[ignore]d) on changes
          # that cannot break a guard, in exchange for the guards being real.
          # Jobs that ask "did rust actually change" must keep asking the
          # unaugmented list, or adding dev/integration below turns them all on
          # for every commit: `lint` gates on non-empty, and `integration`
          # gates on dev/integration being present, which would run the heavy
          # knowledge/lbug build on a README edit.
          rust_touched="$rust"
          rust="$(printf '%s' "$rust" | jq -c '. + ["dev/integration"] | unique')"

          if [ "$frontend_full" = "1" ]; then
            frontend="$FRONT_ALL"
          else
            frontend="$(printf '%s' "$changed_json" | jq -c --argjson all "$FRONT_ALL" \
              '. as $ch | $all | map(select(. as $c | $ch | any(startswith($c + "/"))))')"
          fi

          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "rust_touched=$rust_touched" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "rust components: $rust"
          echo "frontend apps: $frontend"

  rust:
    name: rust check + test
    needs: changes
    if: ${{ needs.changes.outputs.rust != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.changes.outputs.rust) }}
    steps:
      - uses: actions/checkout@v4
      - name: free disk space
        # The knowledge crate vendors a large C++ graph engine (lbug); linking
        # it can exhaust a default runner's disk and crash the linker with a
        # bus error. Reclaim the preinstalled toolchains we do not use.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /
      - name: system deps
        # cmake + nasm build AWS-LC, which aws-lc-rs (pulled in by the tough TUF
        # library, used by forage/cookbook-sign) compiles from C source.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler build-essential pkg-config cmake nasm \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libssl-dev libdbus-1-dev fuse3 libfuse3-dev \
            libdav1d-dev libheif-dev zlib1g-dev libheif-plugin-libde265
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          # Every crate builds into the ONE shared target dir (repo-root
          # .cargo/config.toml `[build] target-dir = "target"`), so cache
          # <root>/target while still keying on this component's Cargo.lock.
          workspaces: ${{ matrix.component }} -> target
      # Both steps go through dev/check-crate.sh, which the justfile also calls,
      # so the local gate and this one cannot spell the same job differently.
      # They did, four times in a week; the script's header lists them.
      - name: check
        run: dev/check-crate.sh check ${{ matrix.component }}
      - name: test
        run: dev/check-crate.sh test ${{ matrix.component }}
      - name: born-translatable lint
        # Runs on the sdk/i18n leg only: the toolchain and the crate's own build
        # are already warm there, so arming this costs one `cargo run` rather than
        # a Rust setup in the build-free structural job. It compares against
        # `dev/i18n-baseline.tsv` and fails only on a string that is NOT already
        # accepted, so it passes today and bites on the next new hardcoded one.
        # An unarmed gate rots: by the time it would catch something, nobody
        # trusts it.
        if: ${{ matrix.component == 'sdk/i18n' }}
        run: |
          cargo run -q --manifest-path sdk/i18n/Cargo.toml --bin arlen-i18n-lint -- \
            --root apps --root sdk/ui-kit --baseline dev/i18n-baseline.tsv

  integration:
    name: integration (EphemeralStack backend smoke)
    needs: changes
    # Run when the backend daemons or the integration harness change (a
    # full-matrix run lists them too). The scenarios assemble real daemons.
    if: ${{ contains(needs.changes.outputs.rust_touched, 'daemons/knowledge') || contains(needs.changes.outputs.rust_touched, 'daemons/event-bus') || contains(needs.changes.outputs.rust_touched, 'dev/integration') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: free disk space
        # The knowledge crate vendors lbug (a large C++ graph engine); linking it
        # can exhaust a default runner's disk. Reclaim unused preinstalled tools.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /
      - name: system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler build-essential pkg-config cmake nasm \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libssl-dev libdbus-1-dev fuse3 libfuse3-dev \
            libdav1d-dev libheif-dev zlib1g-dev libheif-plugin-libde265
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build backend daemons
        run: |
          cargo build --manifest-path daemons/event-bus/Cargo.toml
          cargo build --manifest-path daemons/knowledge/Cargo.toml
      - name: EphemeralStack backend scenarios (FUSE-free)
        # The scenarios set ARLEN_TIMELINE_MOUNT=off, so no /dev/fuse is needed;
        # the audit-daemon + ai-agent scenarios self-skip (those daemons are not
        # built here - they run under `just integration-nightly`). Serial: the
        # spawned daemons mutate process-global + on-disk state.
        run: |
          cargo test --manifest-path dev/integration/Cargo.toml \
            --test integration_backend_smoke -- --ignored --test-threads=1

  units:
    name: systemd unit gates
    # No `needs: changes` filter and no build deps: this is pure shell over the
    # unit files, it runs in seconds, and the drift it catches is deployment
    # hardening - the class that shipped a broken peer-auth sandbox before. It
    # was justfile-only until now, which is exactly why a drift sat unnoticed
    # long enough to disable the gates behind it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: packaged unit gates
        run: bash dev/scripts/check-packaged-units.sh

  lint:
    name: clippy + rustfmt
    needs: changes
    if: ${{ needs.changes.outputs.rust_touched != '[]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler build-essential pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libdbus-1-dev libfuse3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # Format + lint the SDK and AI layer as representative; widen later.
      - name: rustfmt check
        run: |
          for c in sdk ai daemons/event-bus contracts/audit-proto; do
            cargo fmt --manifest-path "$c/Cargo.toml" --all --check || true
          done
      - name: clippy (sdk, ai)
        run: |
          cargo clippy --manifest-path sdk/Cargo.toml --workspace || true
          cargo clippy --manifest-path ai/Cargo.toml --workspace || true

  frontend:
    name: frontend check + vitest
    needs: changes
    if: ${{ needs.changes.outputs.frontend != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.frontend) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The apps depend on the sdk/tauri-plugin-* packages via `file:` links. Each
      # plugin builds its TypeScript dist/ from a `prepare: tsc` script on install,
      # but as a file: dependency npm does not install the plugin's own build deps
      # (@tauri-apps/api, typescript), so an app's `npm ci` fails while building the
      # plugin (TS2307: cannot find '@tauri-apps/api/core'). Build each shared
      # plugin first - installing its own deps + producing dist/ - so it is already
      # resolved by the time an app links it.
      - name: install shared linked packages
        # Everything an app links by `file:` needs its OWN dependencies installed
        # first, because npm does not install a file: dependency's build deps for
        # it. That was true of the tauri plugins and it is equally true of the kit:
        # `sdk/ui-kit` brings its own `@sveltejs/adapter-static`, `messageformat`
        # and `@lucide/svelte`, and without this step an app that links it fails to
        # resolve them - the same defect one level over, in a second place.
        run: |
          for p in sdk/tauri-plugin-* sdk/ui-kit; do
            if [ -f "$p/package.json" ]; then
              echo "== install $p =="
              (cd "$p" && npm install)
              # A SvelteKit package's tsconfig extends ./.svelte-kit/tsconfig.json,
              # which `svelte-kit sync` generates and .gitignore excludes. Installing
              # the kit's deps is what makes vite resolve INTO its tsconfig at all, so
              # this step created the need for the sync: without it every app that
              # links the kit dies with `failed to resolve "extends"`. Locally the
              # file is already there from any previous `npm run check`, which is
              # exactly why the gap only appears on a clean checkout.
              if [ -f "$p/svelte.config.js" ]; then
                (cd "$p" && npx svelte-kit sync)
              fi
            fi
          done
      # The apps use npm (package-lock.json). Skip where there is none.
      - name: check
        working-directory: ${{ matrix.app }}
        run: |
          if [ -f package.json ]; then
            npm ci || npm install
            npm run check || true
            # The unit tests are gating where a package declares them, so logic
            # regressions fail the build (svelte-check stays advisory above).
            # `--passWithNoTests` is a VITEST flag: a package running `node --test`
            # takes it as a file path and exits 1, so only pass it to the runner
            # that understands it.
            if [ "$(npm pkg get scripts.test)" != "{}" ]; then
              if npm pkg get scripts.test | grep -q vitest; then
                npm test -- --passWithNoTests
              else
                npm test
              fi
            fi
            # GATING, and not covered by anything above: `npm run check` is
            # svelte-check (types), which passes on an app that cannot be BUILT.
            # apps/meetings sat in exactly that state - a dynamic route inheriting
            # `prerender = true`, which SvelteKit only rejects when it crawls at
            # build time - and the first sign was the mkosi image build dying
            # minutes in, because that is the only place `npm run build` ran.
            if [ "$(npm pkg get scripts.build)" != "{}" ]; then
              npm run build
            fi
          else
            echo "no package.json, skipping"
          fi
