  rust:
    name: rust check + test
    needs: changes
    if: ${{ needs.changes.outputs.rust != '[]' }}
    runs-on: ubuntu-latest
    # A CEILING, so a job that stops making progress fails with a name instead of
    # holding a matrix slot until someone with the CI view happens to look. On
    # 18 August six unrelated crates sat in_progress for over two hours on run
    # 32083341071 - the same six had taken one to five minutes on the run before
    # - and nothing in this file could end them; GitHub's default is six hours.
    #
    # 75 minutes is picked against the one job that is legitimately slow: a cold
    # `knowledge` build runs about 35 minutes (lbug compiles a C++ engine), so a
    # cache miss on the slowest crate has better than double its measured time
    # before this fires. Anything past that is not building.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.changes.outputs.rust) }}
    steps:
      - uses: actions/checkout@v4
      - name: free disk space
        # The knowledge crate vendors a large C++ graph engine (lbug); linking
        # it can exhaust a default runner's disk and crash the linker with a
        # bus error. Reclaim the preinstalled toolchains we do not use.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /
      # The package bodies, so 118 jobs do not each pull the same 200 MB from
      # the same mirror at the same moment. That contention is what made
      # `system deps` fail a different unrelated job on every run. The key is
      # the script, because the script holds the package list.
      # `ImageOS` is set on the runner PROCESS, not in the workflow's `env` map,
      # so `${{ env.ImageOS }}` in the key below resolved to nothing and the key
      # read `apt-Linux--<hash>` on the first run that used it. Harmless in the
      # sense that a stale entry only costs a re-download, but a key that does not
      # vary with the image is a key that quietly stops matching what it names.
      # Reading it in a step is the way to get it into an expression.
      - name: runner image identity
        id: runner-image
        run: echo "key=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      # RESTORE and SAVE as separate steps, deliberately. `actions/cache` saves in a
      # post-job step that runs only when the job SUCCEEDED - and the job dies
      # inside `system deps` below, so the archive was never written, so the next
      # run restored nothing and hit the same mirror contention. Two runs in a row
      # got worse that way (16 jobs, then 18): a cache that only fills on success
      # cannot help the failure it exists to prevent. Saving with `always()`
      # breaks that: whatever apt did manage to fetch before the ceiling is there
      # for the next run, and a truncated archive costs a re-download rather than
      # a wrong build, because apt checksums what it reuses.
      - name: restore system packages
        id: apt-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-archive-cache
          key: apt-${{ runner.os }}-${{ steps.runner-image.outputs.key }}-${{ hashFiles('dev/scripts/ci-system-packages.txt') }}
      - name: system deps
        # A step ceiling, because THIS is the step that hangs - and the same
        # command succeeds beside it. All 118 rust jobs come from one matrix
        # with one copy of this step, so on run 32104354507 the identical apt
        # line finished for 101 of them and three sat in it for an hour. Not
        # the package list, not a missing package: too many jobs against one
        # mirror. The cache above is the fix; this ceiling is what turns a
        # leftover stall into a red naming the step rather than a job burning
        # its 75-minute allowance.
        timeout-minutes: 10
        run: dev/scripts/ci-system-deps.sh
      # `always()`, so a run that timed out still leaves what it fetched behind.
      # A key that already exists makes this a no-op with a warning, which is the
      # steady state once one run has filled it.
      - name: save system packages
        if: always() && steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/apt-archive-cache
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          # Every crate builds into the ONE shared target dir (repo-root
          # .cargo/config.toml `[build] target-dir = "target"`), so cache
          # <root>/target while still keying on this component's Cargo.lock.
          workspaces: ${{ matrix.component }} -> target
      # Both steps go through dev/check-crate.sh, which the justfile also calls,
      # so the local gate and this one cannot spell the same job differently.
      # They did, four times in a week; the script's header lists them.
      - name: check
        run: dev/check-crate.sh check ${{ matrix.component }}
      - name: test
        run: dev/check-crate.sh test ${{ matrix.component }}
  i18n-lint:
    # Its own job, and the name says what it scans. It used to be a step inside
    # "rust check + test (sdk/i18n)", where it was cheap - that leg's toolchain
    # and crate build are already warm - and where a red went unread for a week:
    # `check` and `test` both passed, so the job read as green-with-no-error-line
    # and nobody scrolled to the third step. The step's own name admitted it was
    # scanning somewhere else, which was the tell that the placement was wrong
    # rather than a caveat worth keeping. A signal nobody reads is not a gate.
    name: born-translatable lint (apps + ui-kit)
    needs: changes
    # Frontend strings, so it runs when the frontend moves. `rust` too, because
    # the lint binary itself lives in sdk/i18n and a change there can alter what
    # it finds.
    if: ${{ needs.changes.outputs.frontend != '[]' || contains(needs.changes.outputs.rust_touched, 'sdk/i18n') }}
    runs-on: ubuntu-latest
    # See the rust job's note. Same ceiling: this job compiles or builds too, and
    # a limit that fires on real work is worse than no limit at all.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdk/i18n -> target
      - name: born-translatable lint
        # Compares against `dev/i18n-baseline.tsv` and fails only on a string that
        # is NOT already accepted, so it passes today and bites on the next new
        # hardcoded one. The annotation puts the reason in the run summary, where
        # a red is actually looked at.
        run: |
          if ! out=$(cargo run -q --manifest-path sdk/i18n/Cargo.toml --bin arlen-i18n-lint -- \
                       --root apps --root sdk/ui-kit --baseline dev/i18n-baseline.tsv 2>&1); then
            printf '%s\n' "$out"
            printf '::error title=born-translatable lint::%s\n' "$(printf '%s' "$out" | head -3 | tr '\n' ' ')"
            exit 1
          fi
          printf '%s\n' "$out"
      - name: born-RTL lint
        # Same shape, same baseline discipline, and it had never run anywhere:
        # not in this file, not in the pre-commit hook. A gate that is built,
        # baselined and unwired accepts whatever grows past it, which is what
        # happened - one physical `margin-left` had appeared in the text editor.
        run: |
          if ! out=$(cargo run -q --manifest-path sdk/i18n/Cargo.toml --bin arlen-rtl-lint -- \
                       --root apps --root sdk/ui-kit --baseline dev/rtl-baseline.tsv 2>&1); then
            printf '%s\n' "$out"
            printf '::error title=born-RTL lint::%s\n' "$(printf '%s' "$out" | head -3 | tr '\n' ' ')"
            exit 1
          fi
          printf '%s\n' "$out"

