  lint:
    name: clippy + rustfmt
    needs: changes
    if: ${{ needs.changes.outputs.rust_touched != '[]' }}
    runs-on: ubuntu-latest
    # See the rust job's note. Same ceiling: this job compiles or builds too, and
    # a limit that fires on real work is worse than no limit at all.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      # The package bodies, so 118 jobs do not each pull the same 200 MB from
      # the same mirror at the same moment. That contention is what made
      # `system deps` fail a different unrelated job on every run. The key is
      # the script, because the script holds the package list.
      # `ImageOS` is set on the runner PROCESS, not in the workflow's `env` map,
      # so `${{ env.ImageOS }}` in the key below resolved to nothing and the key
      # read `apt-Linux--<hash>` on the first run that used it. Harmless in the
      # sense that a stale entry only costs a re-download, but a key that does not
      # vary with the image is a key that quietly stops matching what it names.
      # Reading it in a step is the way to get it into an expression.
      - name: runner image identity
        id: runner-image
        run: echo "key=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      # RESTORE and SAVE as separate steps, deliberately. `actions/cache` saves in a
      # post-job step that runs only when the job SUCCEEDED - and the job dies
      # inside `system deps` below, so the archive was never written, so the next
      # run restored nothing and hit the same mirror contention. Two runs in a row
      # got worse that way (16 jobs, then 18): a cache that only fills on success
      # cannot help the failure it exists to prevent. Saving with `always()`
      # breaks that: whatever apt did manage to fetch before the ceiling is there
      # for the next run, and a truncated archive costs a re-download rather than
      # a wrong build, because apt checksums what it reuses.
      - name: restore system packages
        id: apt-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-archive-cache
          key: apt-${{ runner.os }}-${{ steps.runner-image.outputs.key }}-${{ hashFiles('dev/scripts/ci-system-packages.txt') }}
      - name: system deps
        # A step ceiling, because THIS is the step that hangs - and the same
        # command succeeds beside it. All 118 rust jobs come from one matrix
        # with one copy of this step, so on run 32104354507 the identical apt
        # line finished for 101 of them and three sat in it for an hour. Not
        # the package list, not a missing package: too many jobs against one
        # mirror. The cache above is the fix; this ceiling is what turns a
        # leftover stall into a red naming the step rather than a job burning
        # its 75-minute allowance.
        timeout-minutes: 10
        run: dev/scripts/ci-system-deps.sh
      # `always()`, so a run that timed out still leaves what it fetched behind.
      # A key that already exists makes this a no-op with a warning, which is the
      # steady state once one run has filled it.
      - name: save system packages
        if: always() && steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/apt-archive-cache
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # `components:` above installs clippy and rustfmt for STABLE. Half the dirs
      # this job lints carry a `rust-toolchain.toml` (sdk and event-bus pin 1.90),
      # and a pinned directory silently switches toolchains under cargo - one that
      # rustup then auto-installs WITHOUT the components. So `cargo clippy` there
      # fails with "clippy is not installed", and the `|| true` below swallows it:
      # the step runs, reports nothing, and lints nothing.
      #
      # Derived rather than hardcoded, so a pin that moves does not leave this
      # stale. Reading the active toolchain per directory is the only thing that
      # knows what cargo will actually pick.
      #
      # Two things about that read, probed rather than assumed, because on a fresh
      # runner none of the pinned toolchains exist yet:
      #   * `rustup show active-toolchain` INSTALLS an uninstalled pin as a side
      #     effect, so the name it prints is always usable.
      #   * its progress goes to stderr, so `head -1` on the pipe still gets the
      #     toolchain name and not "info: syncing channel updates".
      # Both matter: if either were the other way round, `tc` would be a log line
      # and the add below would fail on a green tree.
      - name: components for every pinned toolchain this job uses
        run: |
          for c in sdk ai daemons/event-bus contracts/audit-proto; do
            tc=$(cd "$c" && rustup show active-toolchain | head -1 | cut -d' ' -f1)
            echo "$c -> $tc"
            rustup component add clippy rustfmt --toolchain "$tc"
          done
      # Lint the SDK and AI layer as representative; widen later.
      #
      # The rustfmt check below is ADVISORY, and the count is written down for the
      # same reason the clippy step below writes its own down: an unmeasured
      # `|| true` is not advisory, it is decoration.
      #
      # Measured 17 August: 171 files, 1001 hunks. Two things about that number
      # that the loop's shape hides:
      #   * The four entries are not four scopes. `cargo fmt --all` here reaches
      #     past the named workspace into its path dependencies, so the `sdk` pass
      #     alone reports 584 hunks under sdk/, 304 under ai/, 78 under contracts/
      #     and 35 under daemons/. `sdk` and `ai` report an IDENTICAL file set.
      #     Three of the four iterations are near-duplicates of each other.
      #   * `Diff in` is emitted per HUNK, not per file, so the raw line count
      #     overstates the spread by about six times.
      #
      # Not swept here: 171 files across four areas is a mechanical diff over
      # reviewed security code, and it belongs in a commit of its own that does
      # nothing else. Gating it before that sweep would just paint CI red.
      - name: rustfmt check
        run: |
          for c in sdk ai daemons/event-bus contracts/audit-proto; do
            cargo fmt --manifest-path "$c/Cargo.toml" --all --check || true
          done
      - name: clippy (sdk, ai)
        run: |
          # The sdk workspace carries 26 warnings today, so it stays advisory
          # until someone sweeps the rest. `|| true` is honest here only because
          # the number is written down; a check nobody can fail and nobody has
          # counted is not advisory, it is decoration.
          #
          # It said 39 until 17 August and was 47 by the time anyone re-read it,
          # which is what an unchecked count does. The 20 it attributed to "one
          # mechanical class" turned out not to be mechanical at all: they were
          # module docs written with `///` instead of `//!`, so rustdoc attached
          # each one to whatever item happened to follow. `arlen-config` listed
          # its `events` module as "TOML configuration loader for Arlen OS." All
          # 20 fixed; the remaining 26 are genuinely cosmetic (async-fn sugar,
          # derivable impls, enum prefixes).
          cargo clippy --manifest-path sdk/Cargo.toml --workspace || true
          # The ai workspace is clean, so this one FAILS. It went advisory when it
          # had warnings and stayed that way after they were fixed, which meant the
          # whole AI layer could grow new ones with nothing to say so.
          cargo clippy --manifest-path ai/Cargo.toml --workspace -- -D warnings

  frontend:
    name: frontend check + vitest
    needs: changes
    if: ${{ needs.changes.outputs.frontend != '[]' }}
    runs-on: ubuntu-latest
    # See the rust job's note. Same ceiling: this job compiles or builds too, and
    # a limit that fires on real work is worse than no limit at all.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.frontend) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The apps depend on the sdk/tauri-plugin-* packages via `file:` links. Each
      # plugin builds its TypeScript dist/ from a `prepare: tsc` script on install,
      # but as a file: dependency npm does not install the plugin's own build deps
      # (@tauri-apps/api, typescript), so an app's `npm ci` fails while building the
      # plugin (TS2307: cannot find '@tauri-apps/api/core'). Build each shared
      # plugin first - installing its own deps + producing dist/ - so it is already
      # resolved by the time an app links it.
      - name: install shared linked packages
        # Everything an app links by `file:` needs its OWN dependencies installed
        # first, because npm does not install a file: dependency's build deps for
        # it. That was true of the tauri plugins and it is equally true of the kit:
        # `sdk/ui-kit` brings its own `@sveltejs/adapter-static`, `messageformat`
        # and `@lucide/svelte`, and without this step an app that links it fails to
        # resolve them - the same defect one level over, in a second place.
        run: |
          for p in sdk/tauri-plugin-* sdk/ui-kit; do
            if [ -f "$p/package.json" ]; then
              echo "== install $p =="
              (cd "$p" && npm install)
              # A SvelteKit package's tsconfig extends ./.svelte-kit/tsconfig.json,
              # which `svelte-kit sync` generates and .gitignore excludes. Installing
              # the kit's deps is what makes vite resolve INTO its tsconfig at all, so
              # this step created the need for the sync: without it every app that
              # links the kit dies with `failed to resolve "extends"`. Locally the
              # file is already there from any previous `npm run check`, which is
              # exactly why the gap only appears on a clean checkout.
              if [ -f "$p/svelte.config.js" ]; then
                (cd "$p" && npx svelte-kit sync)
              fi
            fi
          done
      # The apps use npm (package-lock.json). Skip where there is none.
      - name: check
        working-directory: ${{ matrix.app }}
        run: |
          if [ -f package.json ]; then
            npm ci || npm install
            # svelte-check is GATING, with a named exception list rather than a
            # blanket `|| true`. It was advisory until 17 August, which made it a
            # check that could not fail: on that date every entry below was
            # measured and the whole tree was clean except the two defects the
            # measurement itself found (a test importing `node:fs` with no
            # @types/node, and a deprecated `<slot>`), both since fixed. An
            # advisory type check is worth roughly nothing, so it gates now.
            #
            # An entry belongs in TYPECHECK_ADVISORY only WITH its reason, and
            # comes out when the reason expires.
            TYPECHECK_ADVISORY=""
            APP="${{ matrix.app }}"
            # Captured, because the EXIT CODE is not the whole answer. When the
            # TypeScript service throws inside svelte-check, the language server
            # catches it per file, drops that file's diagnostics and carries on -
            # so the run exits 0 and prints "found 0 errors" for a tree it did not
            # finish checking. Measured on 26 August: SEVEN of sixteen apps do
            # this, and the number they report is the same as a clean app's.
            #
            # BISECTED 27 August, and it is a version rather than a component.
            # Every crashing app typechecks the kit's tooltip (directly or through
            # `icon-action`) and no clean one does - except `desktop-shell`, which
            # uses it in four files and is also the only app still on svelte
            # 5.56.4. Copying that `svelte` into `apps/text-editor` and running its
            # own `npm run check` finishes the tree with no crash; putting 5.56.8
            # back brings the stack straight home. Ruled out by the same method:
            # bits-ui (2.16.3 swapped in, still crashes), `icon-action`'s template
            # (stripped to a plain button inside the trigger, still crashes), and
            # stale generated types. So svelte 5.56.8 emits types for that
            # component that TypeScript 5.6.3 cannot compare, and the ways out are
            # to pin svelte, to raise TypeScript past 5.6.3, or to change the
            # tooltip - a toolchain decision rather than a code one.
            #
            # TAKEN 28 August: the second way out. Every app pins
            # `typescript` at ~5.9.3, and all seven apps that used to drop a
            # file now finish the tree - settings 11937 files, files 11960,
            # harness 11963, calendar 8226, mail 8223, pdf 8214,
            # system-monitor 8056, each 0 errors. There is no exemption list
            # any more, so the check below fails the build.
            set +e
            npm run check 2>&1 | tee /tmp/svelte-check-$$.log
            CHECK_STATUS=${PIPESTATUS[0]}
            set -e
            if printf ' %s ' "$TYPECHECK_ADVISORY" | grep -qF " $APP "; then
              [ "$CHECK_STATUS" -eq 0 ] || echo "advisory (listed): $APP"
            else
              [ "$CHECK_STATUS" -eq 0 ]
            fi
            if grep -q "Cannot read properties of undefined (reading 'flags')" /tmp/svelte-check-$$.log; then
              echo "$APP crashed the type checker, so it did not check every file -"
              echo "and it reported success anyway. Do not silence this by listing"
              echo "the app: the last one was cured by raising typescript." >&2
              exit 1
            fi
            rm -f /tmp/svelte-check-$$.log
            # The unit tests are gating where a package declares them, so logic
            # regressions fail the build (svelte-check stays gating above).
            # `--passWithNoTests` is a VITEST flag: a package running `node --test`
            # takes it as a file path and exits 1, so only pass it to the runner
            # that understands it.
            if [ "$(npm pkg get scripts.test)" != "{}" ]; then
              if npm pkg get scripts.test | grep -q vitest; then
                npm test -- --passWithNoTests
              else
                npm test
              fi
            fi
            # GATING, and not covered by anything above: `npm run check` is
            # svelte-check (types), which passes on an app that cannot be BUILT.
            # apps/meetings sat in exactly that state - a dynamic route inheriting
            # `prerender = true`, which SvelteKit only rejects when it crawls at
            # build time - and the first sign was the mkosi image build dying
            # minutes in, because that is the only place `npm run build` ran.
            if [ "$(npm pkg get scripts.build)" != "{}" ]; then
              npm run build
            fi
          else
            echo "no package.json, skipping"
          fi
