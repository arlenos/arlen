name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # lbug (Kuzu) vendors thrift C++ that misses <cstdint> on newer GCC.
  CXXFLAGS: "-include cstdint"
  # Keep the target dir small: the knowledge build is disk-heavy enough to
  # crash the linker on a default runner. CI needs neither debug symbols nor
  # incremental rebuilds.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  # Decide which components actually need building. The common case (editing one
  # crate) then runs only that crate's leg instead of all of them. A change to
  # anything shared falls back to the full matrix so a contract or lockfile
  # change still rebuilds every dependent: rust goes full on a Cargo lockfile/
  # manifest, the toolchain, .cargo, .github, contracts/, or any sdk/ crate
  # except sdk/ui-kit; frontend goes full on .github or sdk/ui-kit (the shared
  # component library). When the diff base is unknown (a new branch, a
  # force-push, the first run) or the run was triggered manually both go full,
  # which is the safe default.
  changes:
    name: detect changed components
    runs-on: ubuntu-latest
    # See the rust job's note. Same ceiling: this job compiles or builds too, and
    # a limit that fires on real work is worse than no limit at all.
    timeout-minutes: 75
    outputs:
      rust: ${{ steps.detect.outputs.rust }}
      rust_touched: ${{ steps.detect.outputs.rust_touched }}
      frontend: ${{ steps.detect.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Deliberately NOT in RUST_ALL, so nobody "closes the gap" into a red build:
          #   apps/*/src-tauri  - see below; the stated reasons no longer hold, so the
          #                       fence is a build-time choice now, not a hard block
          #   daemons/kernel-layer/* - need the bpf toolchain / a VM
          #
          # On `apps/*/src-tauri`: the reason recorded here was webkit2gtk + the tauri
          # toolchain, plus `cosmic-comp-config` for settings. Both are stale. This
          # job already installs `libwebkit2gtk-4.1-dev`, `libgtk-3-dev` and
          # `libsoup-3.0-dev` (see the system-deps step), and `apps/settings/src-tauri`
          # builds and tests on a plain host today - its `cosmic-comp-config` git dep
          # resolves. `apps/desktop-shell/src-tauri` builds and runs its 350 tests too.
          #
          # So what keeps them out is BUILD TIME, not capability, and that is worth
          # deciding on purpose: those 350 shell tests never run in CI, which is how a
          # test that failed under the default parallel runner stayed "a known flake"
          # for as long as it did. The matrix is path-filtered, so adding one would
          # only cost on commits that touch it.
          # Everything else that defines a [package] IS listed. Same rule for FRONT_ALL:
          # every package.json declaring a `test` script is listed.
          RUST_ALL='["contracts/audit-proto","contracts/notification-proto","contracts/modulesd-proto","contracts/ai-engine-contract","contracts/graph-schema","contracts/forage-recipe","contracts/capsule","contracts/artifact","contracts/file-change","contracts/launch","contracts/lenv","contracts/run-consent-token","contracts/consent-contract","contracts/extensions","contracts/transcript","contracts/meeting-note","contracts/freedesktop-trash","sdk","sdk/secret-vault","sdk/worker-sandbox","sdk/config-format","sdk/i18n","ai","daemons/event-bus","daemons/knowledge","daemons/notification-daemon","daemons/audit-daemon","daemons/anomaly-detector","daemons/modulesd","daemons/installd","daemons/knowledge-mcp","daemons/file-manager-mcp","daemons/system-monitor-mcp","daemons/xdg-portal","daemons/calendar","daemons/capsuled","daemons/clock","daemons/arlen-run","daemons/online-accounts","daemons/connections","daemons/power-daemon","daemons/journald-parser","daemons/code-indexer","daemons/print","daemons/transfer-daemon","daemons/lock-auth","daemons/wallpaper","daemons/integration-packages","daemons/bridge-ingest","daemons/consent-broker","daemons/config-broker","daemons/settings-broker","daemons/session-supervisor","daemons/session","daemons/undo-service","daemons/ai-engine-daemon","daemons/terminal-run-mcp","daemons/sentinel-detect","daemons/sentineld","store-backend","apps/trash-rm/core","apps/trash-rm/cli","forage","forage/store","forage/fetch","forage/build","forage/package","forage/extract","forage/pipeline","forage/signing","forage/patch","forage/capabilities","forage/cookbook-index","forage/cookbook-sign","forage/cookbook-registry","forage/cookbook-resolve","forage/bridge-install","apps/terminal/core","apps/terminal/engine","apps/files/core","apps/viewers/core","apps/viewers/decode-image","apps/viewers/decode-jxl","apps/viewers/decode-heic","apps/viewers/host","apps/viewers/decode-audio","apps/greeter/core","apps/system-monitor/core","apps/text-editor/core","apps/calendar/core","apps/mail/core","apps/pdf/core","apps/pdf/decode-page","apps/settings/core","apps/screenshot/core","apps/meetings/core","apps/desktop-shell/core","daemons/bottled","dev/integration","dev/dogfood","dev/event-emit","dev/ai-drive","dev/kg-probe"]'
          FRONT_ALL='["sdk/module-sdk","apps/clock","apps/knowledge","daemons/xdg-portal/picker-ui","apps/settings","apps/harness","apps/desktop-shell","apps/terminal","apps/files","apps/greeter","apps/meetings","apps/system-monitor","apps/text-editor","apps/screenshot","apps/store","apps/viewers","apps/calendar","apps/mail","apps/pdf","sdk/ui-kit","ai/pi-plugins"]'

          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE"; head="$PR_HEAD"
          else
            base="$BEFORE"; head="$SHA"
          fi

          base_unknown=0
          # A manual dispatch has no diff base; run the full matrix.
          [ "$EVENT_NAME" = "workflow_dispatch" ] && base_unknown=1
          changed=""
          if [ "$base_unknown" = "1" ] || [ -z "$base" ] || echo "$base" | grep -qE '^0+$'; then
            base_unknown=1
          else
            changed="$(git diff --name-only "$base" "$head" 2>/dev/null || true)"
            [ -z "$changed" ] && base_unknown=1
          fi

          rust_full=$base_unknown
          frontend_full=$base_unknown
          if [ "$base_unknown" = "0" ]; then
            if grep -qE '^(Cargo\.(lock|toml)|rust-toolchain|\.cargo/|\.github/|contracts/)' <<< "$changed"; then
              rust_full=1
            fi
            # any sdk/ change except under sdk/ui-kit/ is a shared rust change
            if grep -E '^sdk/' <<< "$changed" | grep -qvE '^sdk/ui-kit/'; then
              rust_full=1
            fi
            if grep -qE '^(\.github/|sdk/ui-kit/)' <<< "$changed"; then
              frontend_full=1
            fi
          fi

          changed_json="$(printf '%s' "$changed" | jq -R . | jq -cs .)"
          # sdk/ui-kit lives under sdk/ but is a frontend component, not part of
          # the sdk rust workspace, so it must not pull in the sdk rust leg. The
          # rust subset matches against the change list with ui-kit paths removed.
          changed_rust="$(printf '%s' "$changed" | grep -vE '^sdk/ui-kit/' || true)"
          changed_rust_json="$(printf '%s' "$changed_rust" | jq -R . | jq -cs .)"

          if [ "$rust_full" = "1" ]; then
            rust="$RUST_ALL"
          else
            rust="$(printf '%s' "$changed_rust_json" | jq -c --argjson all "$RUST_ALL" \
              '. as $ch | $all | map(select(. as $c | $ch | any(startswith($c + "/"))))')"
          fi
          # dev/integration holds the tree-wide guards: unit identity, image
          # staging, proto agreement, D-Bus activation, both CI matrices, and
          # module/crate reachability. Every one of them asserts something about
          # OTHER crates, so selecting it by its own path meant it ran only when
          # someone edited a guard, never on the commit that broke what the guard
          # watches. A commit adding an unreferenced module to daemons/foo
          # selects daemons/foo alone, and the reachability guard sat it out.
          # Always run it. The cost is one small leg (its dev-deps are light
          # client crates, and the daemon scenarios stay #[ignore]d) on changes
          # that cannot break a guard, in exchange for the guards being real.
          # Jobs that ask "did rust actually change" must keep asking the
          # unaugmented list, or adding dev/integration below turns them all on
          # for every commit: `lint` gates on non-empty, and `integration`
          # gates on dev/integration being present, which would run the heavy
          # knowledge/lbug build on a README edit.
          rust_touched="$rust"
          rust="$(printf '%s' "$rust" | jq -c '. + ["dev/integration"] | unique')"

          if [ "$frontend_full" = "1" ]; then
            frontend="$FRONT_ALL"
          else
            frontend="$(printf '%s' "$changed_json" | jq -c --argjson all "$FRONT_ALL" \
              '. as $ch | $all | map(select(. as $c | $ch | any(startswith($c + "/"))))')"
          fi

          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "rust_touched=$rust_touched" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "rust components: $rust"
          echo "frontend apps: $frontend"

  structural:
    name: structural checks
    # Deliberately NOTHING depends on this job.
    #
    # These steps used to live inside `detect changed components`, which every
    # other job needs - so one red checker skipped the compile, the tests, the
    # integration smoke and clippy all at once. On 9 August a single stale
    # inventory entry did exactly that: for two hours nothing pushed was built or
    # tested, and the message on screen was small enough to read as a tidy-up
    # item. A checker guards a claim ABOUT the tree; it has no business deciding
    # whether the tree gets compiled.
    #
    # Split out so a red here is a red here. It still blocks a merge when it is a
    # required check, which is where that decision belongs.
    runs-on: ubuntu-latest
    # See the rust job's note. Same ceiling: this job compiles or builds too, and
    # a limit that fires on real work is worse than no limit at all.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      # The matrix below is hand-kept and its comment claims every [package] is
      # listed. Nothing checked that, and the justfile copy of the same list had
      # already fallen nine crates behind. Runs here because this job is
      # unconditional: drift can arrive in a commit that touches no rust at all.
      # The catalog gate compiles every MessageFormat source string, so it needs
      # the same formatter the UI runs. This job has no app node_modules and node
      # resolves a bare import from the importing file, so install that one
      # package at the version the apps declare. Deliberately not made skippable:
      # a gate that goes quiet when its dependency is missing is a gate that stops
      # running the day someone changes the layout, and nobody finds out.
      - name: messageformat for the catalog gate
        run: |
          want=$(node -e "console.log(require('./sdk/ui-kit/package.json').dependencies.messageformat)")
          echo "installing messageformat@$want (as declared by sdk/ui-kit)"
          # --prefix is not optional: with no package.json at the repo root npm
          # walks UP to the nearest one and installs there instead, which on a
          # developer machine is $HOME and here would be wherever the runner's
          # checkout sits. Pin it to the checkout so the gate's resolution finds it.
          npm install --prefix "$PWD" --no-save --no-audit --no-fund "messageformat@$want"
          node -e "require('./node_modules/messageformat/package.json')" \
            || { echo "messageformat did not land in the checkout"; exit 1; }
      - name: frame-check fixtures
        # Separate from the block below because it is the one check with a
        # dependency: the boot-verify frame detectors are image code, so their
        # fixtures need Pillow. Kept out of the "build-free, no network" block
        # rather than quietly weakening what that block claims about itself.
        run: |
          python3 -m pip install --quiet --disable-pip-version-check Pillow
          python3 dev/vm/test_frame_checks.py
          python3 dev/vm/test_timed_plan.py
          python3 dev/vm/test_socket_attribution.py
      - name: structural checks
        # The build-free checks and their controls, run directly rather than
        # through `just`, which the runner does not have. Each is deterministic
        # file reading with no network and no build, and each guards something
        # that had already drifted once: the matrix against the tree, an ignore
        # rule against what is tracked, a unit ordering against a unit that
        # exists, the eight copies of event.proto against each other, this
        # workflow against the justfile on how a listed crate is actually built,
        # and a shared file's reader against its writer.
        #
        # It said "the seven" until 27 August and there are 225 invocations in
        # this step - a count in a comment is a claim that ages every time
        # somebody adds a line below it, so this one names the kind rather than
        # the number.
        run: |
          python3 dev/scripts/check-crate-coverage.py
          python3 dev/scripts/check-proto-drift.py
          python3 dev/scripts/check-gate-drift.py
          python3 dev/scripts/check-comment-paths.py
          python3 dev/scripts/check-dbus-method-names.py
