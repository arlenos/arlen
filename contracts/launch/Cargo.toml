[package]
license = "Apache-2.0"
name = "arlen-launch-contract"
version = "0.1.0"
edition = "2021"
description = "The launch request contract: an app id or a document, never a command line"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# `net` because the round trip below is part of the contract. A framing
# convention with no client is a convention every caller reimplements, and the
# thirteen `xdg-open` sites this replaces are what that looked like in practice.
tokio = { version = "1", features = ["io-util", "net"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt"] }

[workspace]
