[package]
license = "Apache-2.0"
name = "arlen-launch-contract"
version = "0.1.0"
edition = "2021"
description = "The launch request contract: an app id or a document, never a command line"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt"] }

[workspace]
