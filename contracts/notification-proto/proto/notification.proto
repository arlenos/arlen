syntax = "proto3";
package arlen.notification;

// ── Enums ────────────────────────────────────────────────────────────────

enum Priority {
    PRIORITY_LOW = 0;
    PRIORITY_NORMAL = 1;
    PRIORITY_HIGH = 2;
    PRIORITY_CRITICAL = 3;
}

enum CloseReason {
    CLOSE_EXPIRED = 0;
    CLOSE_DISMISSED = 1;
    CLOSE_CLOSED = 2;
    CLOSE_UNDEFINED = 3;
}

// DND operating mode wire encoding.
//
// `DND_ON` is kept at value 1 for backwards compatibility with older
// shell builds (it now means the same thing as `DND_PRIORITY`). New
// clients should send/expect the more specific variants.
enum DndMode {
    DND_OFF = 0;
    DND_ON = 1;            // legacy alias for DND_PRIORITY
    DND_SCHEDULED = 2;
    DND_PRIORITY = 3;      // only critical-urgency notifications pass
    DND_ALARMS = 4;        // only alarm/reminder category notifications pass
    DND_TOTAL = 5;         // nothing passes (except always_allow apps)
}

// ── Data types ───────────────────────────────────────────────────────────

message Action {
    string key = 1;
    string label = 2;
}

message Notification {
    uint32 id = 1;
    string app_name = 2;
    string summary = 3;
    string body = 4;
    string app_icon = 5;
    repeated Action actions = 6;
    Priority priority = 7;
    string category = 8;
    string timestamp = 9;
    bool read = 10;
}

// ── Server -> Client messages ────────────────────────────────────────────

message ServerMessage {
    oneof msg {
        NotificationAdded added = 1;
        NotificationClosed closed = 2;
        ActionInvoked action_invoked = 3;
        NotificationRead notification_read = 4;
        AllCleared all_cleared = 5;
        DndStateChanged dnd_changed = 6;
        SyncResponse sync = 7;
        HistoryResponse history = 8;
        CountUpdate count_update = 9;
        KnownAppsResponse known_apps = 10;
        JobUpdate job_update = 11;
    }
}

// A change to one long-running job (job-progress-surface.md). The same daemon
// that serves notifications hosts the JobViewServer; a producer's register /
// update / finish is pushed to the shell here so the Activity/Jobs zone renders
// it live, without a second socket.
message JobUpdate {
    uint64 id = 1;              // stable job id
    string app_id = 2;         // producing app
    string title = 3;          // "Copying 240 photos to USB"
    string state = 4;          // running/paused/impeded/error-recoverable/error-fatal/done
    string state_message = 5;  // why, for non-running states; empty for running
    string unit = 6;           // bytes/files/directories/items
    uint64 processed = 7;      // amount done, in unit
    bool determinate = 8;      // whether total is known (the bar can be drawn)
    uint64 total = 9;          // total, meaningful only when determinate
    double fraction = 10;      // the monotonic 0..1 bar (never regresses)
    bool killable = 11;        // the shell may offer Cancel/Stop
    bool suspendable = 12;     // the shell may offer Pause/Resume
    uint64 started_at = 13;    // epoch micros, for the elapsed line
    string egress_host = 14;   // the host this job reaches; empty = no egress
    bool removed = 15;         // true = the job is gone; clear it from the live set
}

message NotificationAdded {
    Notification notification = 1;
}

message NotificationClosed {
    uint32 id = 1;
    CloseReason reason = 2;
}

message ActionInvoked {
    uint32 id = 1;
    string action_key = 2;
}

message NotificationRead {
    uint32 id = 1;
}

message AllCleared {
}

message DndStateChanged {
    DndMode mode = 1;
}

message SyncResponse {
    repeated Notification pending = 1;
    uint32 unread_count = 2;
    DndMode dnd_mode = 3;
}

message HistoryResponse {
    repeated Notification notifications = 1;
    bool has_more = 2;
}

message CountUpdate {
    uint32 pending_count = 1;
    uint32 unread_count = 2;
}

// Response to GetKnownApps. Contains every distinct `app_name` that
// has ever sent a notification through the daemon (sourced from the
// SQLite history table).
message KnownAppsResponse {
    repeated string app_names = 1;
}

// ── Client -> Server messages ────────────────────────────────────────────

message ClientMessage {
    oneof msg {
        ClientHello hello = 1;
        DismissNotification dismiss = 2;
        InvokeAction invoke_action = 3;
        MarkRead mark_read = 4;
        ClearAll clear_all = 5;
        SetDndMode set_dnd = 6;
        GetHistory get_history = 7;
        GetKnownApps get_known_apps = 8;
    }
}

message ClientHello {
    string client_name = 1;
}

message DismissNotification {
    uint32 id = 1;
}

message InvokeAction {
    uint32 id = 1;
    string action_key = 2;
}

message MarkRead {
    uint32 id = 1;
}

message ClearAll {
}

message SetDndMode {
    DndMode mode = 1;
}

message GetHistory {
    uint32 limit = 1;
    string before_timestamp = 2;
    string app_name = 3;
}

// Request the list of distinct app names known to the daemon.
// Used by the Settings app's per-app rule editor.
message GetKnownApps {}
