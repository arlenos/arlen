[package]
license = "Apache-2.0"
name = "modulesd-proto"
version = "0.1.0"
edition = "2021"
description = "Wire protocol types shared between arlen-modulesd and its clients (desktop-shell, settings, forage)"

[dependencies]
# The single-shot client speaks the same socket the daemon binds.
tokio = { version = "1", features = ["net", "io-util"] }
thiserror = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "net", "io-util"] }
