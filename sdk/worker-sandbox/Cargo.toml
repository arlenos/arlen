[package]
license = "AGPL-3.0-only"
name = "arlen-worker-sandbox"
version = "0.1.0"
edition = "2021"
description = "Run an untrusted parser in a box: bwrap namespaces, a seccomp allowlist, a watchdog and a bounded frame back (quickview-plan.md)"

[lib]
name = "arlen_worker_sandbox"

[dependencies]
arlen-confiner = { path = "../confiner" }
# SIGKILL the confined worker on the timeout (a hung or compromised worker).
libc = "0.2"
# The per-worker syscall allowlist compiled to cBPF for `bwrap --seccomp <fd>`.
seccompiler = "0.5"

[workspace]
