# Starting permission profile for lapce (a code editor). Opens and saves files under
# Documents; no network and no Knowledge Graph by default. Observe-mode refines it.
[info]
app_id = "dev.lapce.lapce"
tier = "third-party"

[filesystem]
documents = true

# Same app as `lapce`, under the desktop-id this packaging installs. An app is
# only reachable under the id it is actually launched by.
