# Starting permission profile for Showtime (a video player). Plays the user's
# local video and music; no network and no Knowledge Graph.
#
# ONE ANSWER FOR BOTH PACKAGING IDS (15 Sep): the reverse-DNS id had Videos
# alone. Like Celluloid beside it, this is a GStreamer front end that opens an
# audio file as readily as a video one.
[info]
app_id = "org.gnome.Showtime"
tier = "third-party"

[filesystem]
videos = true
music = true
