# Starting permission profile for IntelliJ IDEA Community (an IDE). Documents
# (projects), no network by default (plugin/dependency fetches are a deliberate
# opt-in); no graph.
[info]
app_id = "jetbrains-idea"
tier = "third-party"

[filesystem]
documents = true

# Same app as `com.jetbrains.IntelliJ-IDEA-Community`, under the desktop-id this packaging installs. An app is
# only reachable under the id it is actually launched by.
