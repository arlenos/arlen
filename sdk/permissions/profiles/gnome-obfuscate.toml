# Starting permission profile for Obfuscate (an image-redaction tool). Reads and
# writes images in Pictures; no network, no graph.
#
# This held the whole home tree on the reasoning that it "opens an image and saves
# the censored copy, so it gets home filesystem access". Opening a file the user
# picked is what the file portal does, and it does not imply the rest of the tree;
# `com.belmoussaoui.Obfuscate` had already said Pictures for the same program.
[info]
app_id = "gnome-obfuscate"
tier = "third-party"

[filesystem]
pictures = true
