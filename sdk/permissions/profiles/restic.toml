# Starting permission profile for restic (an encrypted backup program). Home,
# because a backup reads what it is told to back up and that is the user's tree by
# definition - a narrower grant makes the program silently skip what it cannot
# see, which is the one failure mode a backup must not have. Network because a
# repository is commonly remote (SFTP, S3, rest-server).
[info]
app_id = "restic"
tier = "third-party"

[filesystem]
home = true

# NETWORK-SCOPE-PENDING: this grants the whole network because the scoped form
# cannot be enforced yet - `arlen-run` refuses a FilteredHosts policy without an
# egress enforcer (exit 67), and nothing raises a NetworkAccess consent for a host
# an app did not declare, so narrowing today would leave the app with no network
# and no way to ask. Revisit when both land: most of these want a host list.
[network]
allow_all = true
