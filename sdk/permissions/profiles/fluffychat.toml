# Starting permission profile for FluffyChat (a Matrix client). Talks to a
# homeserver over the network, which is its function, and saves an attachment you
# choose to Downloads. No Knowledge Graph access.
#
# ONE ANSWER FOR BOTH PACKAGING IDS (15 Sep): the reverse-DNS id had no file
# grant, which leaves "save attachment" with nowhere to put it. Downloads rather
# than more, because sending a file the other way goes through the file portal.
[info]
app_id = "fluffychat"
tier = "third-party"

[filesystem]
downloads = true

# NETWORK-SCOPE-PENDING: this grants the whole network because a narrowed one has
# nowhere to send its refusal. HALF of that is now built: `arlen-run` installs the
# egress proxy for a FilteredHosts policy and no longer refuses the launch. What is
# still missing is the ask - nothing raises a consent for a host an app did not
# declare, so a scoped app meets a bare 403 and cannot request the host. Revisit
# when that lands: most of these want a host list, and the list is the easy half.
[network]
allow_all = true
