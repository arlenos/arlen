# Starting permission profile for Scribus (a desktop-publishing app).
# Lays out documents with embedded images; no network by function. No graph.
#
# The same program under another id, carrying the answer worked out for
# `net.scribus.Scribus`: a layout app that places images needs Pictures, and
# leaving it off here made the same app depend on where it was installed from.
[info]
app_id = "org.scribus.Scribus"
tier = "third-party"

[filesystem]
documents = true
pictures = true
