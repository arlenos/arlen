# Starting permission profile for Vorta (a desktop front end for Borg backup).
# Backing up the user's files IS its function, so it holds the directories a
# backup covers, and it sends them to a repository over the network.
#
# ONE ANSWER FOR BOTH PACKAGING IDS (15 Sep): the bare id granted the whole Home
# and the other five named directories. The named set is what a person picks in
# the source list, and it stops short of the dotfiles and app data a Home grant
# hands over - a backup tool is exactly the app where "everything" is tempting
# and where the user should be choosing. A source outside the five is added
# through a grant refinement.
[info]
app_id = "com.borgbase.Vorta"
tier = "third-party"

[filesystem]
documents = true
downloads = true
pictures = true
music = true
videos = true

# NETWORK-SCOPE-PENDING: this grants the whole network because a narrowed one has
# nowhere to send its refusal. HALF of that is now built: `arlen-run` installs the
# egress proxy for a FilteredHosts policy and no longer refuses the launch. What is
# still missing is the ask - nothing raises a consent for a host an app did not
# declare, so a scoped app meets a bare 403 and cannot request the host. Revisit
# when that lands: most of these want a host list, and the list is the easy half.
[network]
allow_all = true
