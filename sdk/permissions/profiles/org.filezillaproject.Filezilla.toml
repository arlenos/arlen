# Starting permission profile for FileZilla (an FTP/SFTP client). Needs network
# to transfer; saves to Downloads. No Knowledge Graph access.
#
# ONE ANSWER FOR BOTH PACKAGING IDS (15 Sep): the reverse-DNS id granted the whole
# Home, reasoning that it "uploads/downloads arbitrary local files". Uploading an
# arbitrary file is exactly what the file portal is for - the user picks it and
# the app receives it - so the Home grant bought the app nothing and gave it
# everything.
[info]
app_id = "org.filezillaproject.Filezilla"
tier = "third-party"

[filesystem]
downloads = true

# NETWORK-SCOPE-PENDING: this grants the whole network because a narrowed one has
# nowhere to send its refusal. HALF of that is now built: `arlen-run` installs the
# egress proxy for a FilteredHosts policy and no longer refuses the launch. What is
# still missing is the ask - nothing raises a consent for a host an app did not
# declare, so a scoped app meets a bare 403 and cannot request the host. Revisit
# when that lands: most of these want a host list, and the list is the easy half.
[network]
allow_all = true
