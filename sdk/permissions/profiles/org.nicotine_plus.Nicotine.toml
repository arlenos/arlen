# Starting permission profile for Nicotine+ (a Soulseek peer-to-peer client).
# Its function is networked file sharing, so it gets network and Downloads
# (where received files land). A specific shared directory is opt-in config,
# refined by observe-mode rather than a blanket home grant. No graph.
[info]
app_id = "org.nicotine_plus.Nicotine"
tier = "third-party"

[filesystem]
downloads = true

# NETWORK-SCOPE-PENDING: this grants the whole network because the scoped form
# cannot be enforced yet - `arlen-run` refuses a FilteredHosts policy without an
# egress enforcer (exit 67), and nothing raises a NetworkAccess consent for a host
# an app did not declare, so narrowing today would leave the app with no network
# and no way to ask. Revisit when both land: most of these want a host list.
[network]
allow_all = true
