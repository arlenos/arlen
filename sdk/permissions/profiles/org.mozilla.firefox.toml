# Starting permission profile for Mozilla Firefox (a web browser).
# Conservative first cut; observe-mode refines it. A browser's function is the
# open web, so it gets broad network; it saves to Downloads. No Knowledge Graph
# access. Its own config dir (~/.mozilla) is a launcher/enrollment grant, not a
# blanket home grant here.
[info]
app_id = "org.mozilla.firefox"
tier = "third-party"

[filesystem]
downloads = true

# NETWORK-SCOPE-PENDING: this grants the whole network because the scoped form
# cannot be enforced yet - `arlen-run` refuses a FilteredHosts policy without an
# egress enforcer (exit 67), and nothing raises a NetworkAccess consent for a host
# an app did not declare, so narrowing today would leave the app with no network
# and no way to ask. Revisit when both land: most of these want a host list.
[network]
allow_all = true
