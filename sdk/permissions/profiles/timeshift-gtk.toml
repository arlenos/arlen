# Starting permission profile for a system/config/utility app. No file access,
# no network and no Knowledge Graph by default; privileged operations elevate via
# polkit and configuration lives in dconf / the keyring / online-accounts.
[info]
app_id = "timeshift-gtk"
tier = "third-party"

# Same app as `timeshift`, under the desktop-id this packaging installs. An app is
# only reachable under the id it is actually launched by.
