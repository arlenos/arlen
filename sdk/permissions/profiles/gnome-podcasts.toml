# Starting permission profile for GNOME Podcasts (a podcast player). Fetches
# feeds and episodes over the network, which is its function, and keeps a
# downloaded episode in Music. No Knowledge Graph access.
#
# ONE ANSWER FOR BOTH PACKAGING IDS (15 Sep), and each had a different idea of
# where an episode goes. Music, because a downloaded episode is audio the user
# keeps and plays, not a file they fetched once.
[info]
app_id = "gnome-podcasts"
tier = "third-party"

[filesystem]
music = true

# NETWORK-SCOPE-PENDING: this grants the whole network because a narrowed one has
# nowhere to send its refusal. HALF of that is now built: `arlen-run` installs the
# egress proxy for a FilteredHosts policy and no longer refuses the launch. What is
# still missing is the ask - nothing raises a consent for a host an app did not
# declare, so a scoped app meets a bare 403 and cannot request the host. Revisit
# when that lands: most of these want a host list, and the list is the easy half.
[network]
allow_all = true
