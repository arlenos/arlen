# Starting permission profile for Ryujinx (a Nintendo Switch emulator). Games, firmware and
# saves live in Documents and Downloads; no network and no Knowledge Graph.
#
# ONE ANSWER FOR BOTH PACKAGING IDS (15 Sep): the bare id granted nothing, so the
# emulator could not reach a game the user had put anywhere. Same gap as the
# melonDS, mGBA and DuckStation groups.
[info]
app_id = "ryujinx"
tier = "third-party"

[filesystem]
documents = true
downloads = true
