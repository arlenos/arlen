# Starting permission profile for Ptyxis (a terminal emulator). A terminal's function
# is an interactive shell in the user's environment - it must reach the home tree to
# run commands there, and the commands a user runs (git/ssh/curl) need the network -
# so both are granted by function. No Knowledge Graph access.
[info]
app_id = "app.devsuite.Ptyxis"
tier = "third-party"

[filesystem]
home = true

# NETWORK-SCOPE-PENDING: this grants the whole network because the scoped form
# cannot be enforced yet - `arlen-run` refuses a FilteredHosts policy without an
# egress enforcer (exit 67), and nothing raises a NetworkAccess consent for a host
# an app did not declare, so narrowing today would leave the app with no network
# and no way to ask. Revisit when both land: most of these want a host list.
[network]
allow_all = true
