# Starting permission profile for an infrastructure tool. It reads declarations
# from whatever project directory the user runs it in, so it gets Home like the
# other terminal tools here, and it reaches remote providers or a cluster, so it
# gets network. No Knowledge Graph. The credentials it uses live in its own config
# dir; a different state backend is an explicit grant.
[info]
app_id = "argocd"
tier = "third-party"

[filesystem]
home = true

# NETWORK-SCOPE-PENDING: this grants the whole network because the scoped form
# cannot be enforced yet - `arlen-run` refuses a FilteredHosts policy without an
# egress enforcer (exit 67), and nothing raises a NetworkAccess consent for a host
# an app did not declare, so narrowing today would leave the app with no network
# and no way to ask. Revisit when both land: most of these want a host list.
[network]
allow_all = true
