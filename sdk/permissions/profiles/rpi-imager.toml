# Starting permission profile for an SD-card imaging tool. It downloads OS images
# over the network and saves them to Downloads, which is its normal workflow;
# writing the raw block device is privileged and elevates via polkit rather than
# through this profile. Matches org.raspberrypi.rpi-imager. No Knowledge Graph.
[info]
app_id = "rpi-imager"
tier = "third-party"

[filesystem]
downloads = true

[network]
allow_all = true
