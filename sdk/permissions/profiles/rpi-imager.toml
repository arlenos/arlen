# Starting permission profile for an SD-card imaging tool. It downloads OS images
# over the network and saves them to Downloads, which is its normal workflow;
# writing the raw block device is privileged and elevates via polkit rather than
# through this profile. Matches org.raspberrypi.rpi-imager. No Knowledge Graph.
[info]
app_id = "rpi-imager"
tier = "third-party"

[filesystem]
downloads = true

# NETWORK-SCOPE-PENDING: this grants the whole network because the scoped form
# cannot be enforced yet - `arlen-run` refuses a FilteredHosts policy without an
# egress enforcer (exit 67), and nothing raises a NetworkAccess consent for a host
# an app did not declare, so narrowing today would leave the app with no network
# and no way to ask. Revisit when both land: most of these want a host list.
[network]
allow_all = true
