# Starting permission profile for Jellyfin Media Player (a client for a Jellyfin
# server). Streams from the server over the network, which is its function, plays
# local media from Videos and Music, and keeps a download for offline in
# Downloads. No Knowledge Graph access.
#
# ONE ANSWER FOR ALL THREE PACKAGING IDS (15 Sep): two had the media directories
# and no Downloads, one had Downloads and no media - so depending on where you
# installed it, either offline downloads or local playback was missing.
[info]
app_id = "com.github.iwalton3.jellyfin-media-player"
tier = "third-party"

[filesystem]
videos = true
music = true
downloads = true

# NETWORK-SCOPE-PENDING: this grants the whole network because a narrowed one has
# nowhere to send its refusal. HALF of that is now built: `arlen-run` installs the
# egress proxy for a FilteredHosts policy and no longer refuses the launch. What is
# still missing is the ask - nothing raises a consent for a host an app did not
# declare, so a scoped app meets a bare 403 and cannot request the host. Revisit
# when that lands: most of these want a host list, and the list is the easy half.
[network]
allow_all = true
