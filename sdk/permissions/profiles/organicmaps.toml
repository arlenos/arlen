# Starting permission profile for Organic Maps (an offline maps app). Downloads map
# regions over the network into its own data dir; no broad file access and no
# Knowledge Graph.
[info]
app_id = "organicmaps"
tier = "third-party"

# NETWORK-SCOPE-PENDING: this grants the whole network because the scoped form
# cannot be enforced yet - `arlen-run` refuses a FilteredHosts policy without an
# egress enforcer (exit 67), and nothing raises a NetworkAccess consent for a host
# an app did not declare, so narrowing today would leave the app with no network
# and no way to ask. Revisit when both land: most of these want a host list.
[network]
allow_all = true
