# Starting permission profile for Wireshark (a network protocol analyzer).
# Network is its function (live capture); capture files (.pcap/.pcapng) are
# opened and saved from Documents. No graph, no other user dirs. NB live capture
# also needs a raw-socket/dumpcap privilege the install grants out of band; this
# profile covers only the app-data surface.
[info]
app_id = "org.wireshark.Wireshark"
tier = "third-party"

[filesystem]
documents = true

# NETWORK-SCOPE-PENDING: this grants the whole network because the scoped form
# cannot be enforced yet - `arlen-run` refuses a FilteredHosts policy without an
# egress enforcer (exit 67), and nothing raises a NetworkAccess consent for a host
# an app did not declare, so narrowing today would leave the app with no network
# and no way to ask. Revisit when both land: most of these want a host list.
[network]
allow_all = true
