# Starting permission profile for KDE Connect (phone integration). Connects to the paired device over the network (its function); received files land in Downloads. Clipboard/notification/input bridging are separate capability grants out of band.
[info]
app_id = "org.kde.kdeconnect.nonplasma"
tier = "third-party"

[filesystem]
downloads = true

# NETWORK-SCOPE-PENDING: this grants the whole network because the scoped form
# cannot be enforced yet - `arlen-run` refuses a FilteredHosts policy without an
# egress enforcer (exit 67), and nothing raises a NetworkAccess consent for a host
# an app did not declare, so narrowing today would leave the app with no network
# and no way to ask. Revisit when both land: most of these want a host list.
[network]
allow_all = true

# The same KDE Connect install, under the desktop-id this component ships as.
# An app is only reachable under the id it is actually launched by.
