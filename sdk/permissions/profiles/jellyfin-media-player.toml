# Starting permission profile for Jellyfin Media Player.
# Streams media from a Jellyfin server over the network; plays local media from
# Videos and Music. No Knowledge Graph access.
[info]
app_id = "jellyfin-media-player"
tier = "third-party"

[filesystem]
videos = true
music = true

# NETWORK-SCOPE-PENDING: this grants the whole network because the scoped form
# cannot be enforced yet - `arlen-run` refuses a FilteredHosts policy without an
# egress enforcer (exit 67), and nothing raises a NetworkAccess consent for a host
# an app did not declare, so narrowing today would leave the app with no network
# and no way to ask. Revisit when both land: most of these want a host list.
[network]
allow_all = true

# This said "no network by default (its server streaming is refined later)",
# copied from the generic media-player template - for a client whose entire
# function is talking to a Jellyfin server. Both dotted ids already granted it.
