# Starting permission profile for Jellyfin Media Player.
# Streams media from a Jellyfin server over the network; plays local media from
# Videos and Music. No Knowledge Graph access.
[info]
app_id = "jellyfin-media-player"
tier = "third-party"

[filesystem]
videos = true
music = true

# NETWORK-SCOPE-PENDING: this grants the whole network because a narrowed one has
# nowhere to send its refusal. HALF of that is now built: `arlen-run` installs the
# egress proxy for a FilteredHosts policy and no longer refuses the launch. What is
# still missing is the ask - nothing raises a consent for a host an app did not
# declare, so a scoped app meets a bare 403 and cannot request the host. Revisit
# when that lands: most of these want a host list, and the list is the easy half.
[network]
allow_all = true

# This said "no network by default (its server streaming is refined later)",
# copied from the generic media-player template - for a client whose entire
# function is talking to a Jellyfin server. Both dotted ids already granted it.
