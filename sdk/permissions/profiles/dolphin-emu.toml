# Starting permission profile for org.DolphinEmu.dolphin-emu (a game-console emulator).
# It loads game images from local files by function, so it gets Documents and
# Downloads (where ROMs are kept) and no network; netplay is opt-in. No
# Knowledge Graph access.
#
# The same program packaged under another name, and it gets the answer that was
# already worked out for `org.DolphinEmu.dolphin-emu` rather than the generic template it
# had. Where an app came from is not a reason to confine it differently.
[info]
app_id = "dolphin-emu"
tier = "third-party"

[filesystem]
documents = true
downloads = true
