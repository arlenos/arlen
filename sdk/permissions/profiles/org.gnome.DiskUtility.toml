# Starting permission profile for a disk/log/system utility. No file access, no
# network and no Knowledge Graph; it reads system info over D-Bus and /proc and
# elevates via polkit for privileged operations.
[info]
app_id = "org.gnome.DiskUtility"
tier = "third-party"

# Same app as `gnome-disk-utility`, under the desktop-id this packaging installs. An app is
# only reachable under the id it is actually launched by.
