# Starting permission profile for Warpinator (local-network file transfer).
# It sends and receives files across the local network by function. It gets network. No Knowledge Graph access.
#
# Transfers land through the file portal, so it needs no standing filesystem grant.
# `org.x.warpinator` had already settled this for the same program.
[info]
app_id = "org.x.Warpinator"
tier = "third-party"


# NETWORK-SCOPE-PENDING: this grants the whole network because the scoped form
# cannot be enforced yet - `arlen-run` refuses a FilteredHosts policy without an
# egress enforcer (exit 67), and nothing raises a NetworkAccess consent for a host
# an app did not declare, so narrowing today would leave the app with no network
# and no way to ask. Revisit when both land: most of these want a host list.
[network]
allow_all = true
