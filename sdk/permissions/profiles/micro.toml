# Starting permission profile for micro (a terminal text editor). It edits the
# files it is handed, which live in Documents; no network and no Knowledge Graph
# access.
#
# ONE ANSWER FOR BOTH PACKAGING IDS (15 Sep): the bare id granted the whole Home.
# A terminal editor is usually launched ON a path by a shell that already has
# it - the grant that matters there is the terminal's, not the editor's - and a
# file outside Documents opened from the desktop arrives through the file portal.
[info]
app_id = "micro"
tier = "third-party"

[filesystem]
documents = true
