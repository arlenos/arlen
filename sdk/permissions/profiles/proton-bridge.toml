# Starting permission profile for a mail bridge. Needs network to reach the mail
# service (any host) and runs a local IMAP/SMTP endpoint for mail clients; its
# cache lives in its own config dir, so no document-folder access and no Knowledge
# Graph by default. Observe-mode refines it.
[info]
app_id = "proton-bridge"
tier = "third-party"

# NETWORK-SCOPE-PENDING: this grants the whole network because the scoped form
# cannot be enforced yet - `arlen-run` refuses a FilteredHosts policy without an
# egress enforcer (exit 67), and nothing raises a NetworkAccess consent for a host
# an app did not declare, so narrowing today would leave the app with no network
# and no way to ask. Revisit when both land: most of these want a host list.
[network]
allow_all = true

# Same app as `protonmail-bridge`, under the desktop-id this packaging installs. An app is
# only reachable under the id it is actually launched by.
