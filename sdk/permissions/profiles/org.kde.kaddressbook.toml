# Starting permission profile for KAddressBook (a contacts manager). Imports and
# exports vCards through Documents; no network and no Knowledge Graph access.
#
# ONE ANSWER FOR BOTH PACKAGING IDS (15 Sep): the bare id granted nothing, so a
# vCard could be neither imported nor exported.
[info]
app_id = "org.kde.kaddressbook"
tier = "third-party"

[filesystem]
documents = true
