# Starting permission profile for DuckStation (a console emulator). ROMs and
# memory cards live in Documents and Downloads; no network and no Knowledge
# Graph.
#
# ONE ANSWER FOR BOTH PACKAGING IDS (15 Sep): the bare id granted nothing at all,
# so the emulator could not reach a ROM the user had put anywhere.
[info]
app_id = "org.duckstation.DuckStation"
tier = "third-party"

[filesystem]
documents = true
downloads = true
