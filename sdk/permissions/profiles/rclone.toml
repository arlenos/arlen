# Starting permission profile for rclone (sync to cloud storage). Network is its
# function and the remote is user-configured, so no host is knowable. The local
# side is a custom path the user grants explicitly rather than a blanket Home:
# rclone is pointed at one directory at a time, which makes the narrow grant the
# workable one here where it is not for a backup tool that walks the whole tree.
#
# NB Arlen's online-accounts daemon runs its own confined rclone for accounts the
# user has connected. This profile is for the user's own copy, invoked by hand,
# and the two are separate: that one is configured by the daemon and never reads
# this file.
[info]
app_id = "rclone"
tier = "third-party"

# NETWORK-SCOPE-PENDING: this grants the whole network because a narrowed one has
# nowhere to send its refusal. HALF of that is now built: `arlen-run` installs the
# egress proxy for a FilteredHosts policy and no longer refuses the launch. What is
# still missing is the ask - nothing raises a consent for a host an app did not
# declare, so a scoped app meets a bare 403 and cannot request the host. Revisit
# when that lands: most of these want a host list, and the list is the easy half.
[network]
allow_all = true
