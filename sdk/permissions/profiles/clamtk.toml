# Starting permission profile for ClamTk (a ClamAV antivirus GUI). It updates virus
# definitions over the network; the paths it scans are portal-selected on use, so it
# needs no broad filesystem grant and no Knowledge Graph access.
[info]
app_id = "clamtk"
tier = "third-party"

# NETWORK-SCOPE-PENDING: this grants the whole network because the scoped form
# cannot be enforced yet - `arlen-run` refuses a FilteredHosts policy without an
# egress enforcer (exit 67), and nothing raises a NetworkAccess consent for a host
# an app did not declare, so narrowing today would leave the app with no network
# and no way to ask. Revisit when both land: most of these want a host list.
[network]
allow_all = true

# Same app as `com.gitlab.davem.ClamTk`, under the desktop-id this packaging
# installs. Deliberately identical: this file first said `home = true`, which
# would have meant the same scanner holding your whole home tree or nothing
# depending on which package you installed.
