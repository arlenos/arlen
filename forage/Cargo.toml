[package]
license = "AGPL-3.0-only"
name = "forage"
version = "0.1.0"
edition = "2021"
description = "Arlen OS package manager CLI"

[[bin]]
name = "forage"
path = "src/main.rs"

[dependencies]
# The install-time consent decision for a bridge namespace grant.
arlen-consent-contract = { path = "../contracts/consent-contract" }
clap = { version = "4", features = ["derive"] }
arlen-modules = { path = "../sdk/modules" }
arlen-forage-recipe = { path = "../contracts/forage-recipe" }
arlen-forage-pipeline = { path = "pipeline" }
arlen-forage-build = { path = "build" }
arlen-forage-fetch = { path = "fetch" }
arlen-forage-store = { path = "store" }
arlen-forage-extract = { path = "extract" }
arlen-forage-signing = { path = "signing" }
arlen-cookbook-registry = { path = "cookbook-registry" }
arlen-cookbook-resolve = { path = "cookbook-resolve" }
arlen-forage-capabilities = { path = "capabilities" }
arlen-forage-bridge-install = { path = "bridge-install" }
notification-proto = { path = "../contracts/notification-proto", features = ["client"] }
colored = "2"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
futures-util = "0.3"
dirs = "6"
tempfile = "3"

[dev-dependencies]
tempfile = "3"
# The lunpkg-id reader is only worth anything if it reads a REAL package, so the
# round-trip test builds one with the writer that produces them.
arlen-forage-package = { path = "package" }
ed25519-dalek = { version = "2", features = ["std"] }
# The bridge-flow tests assert the provisioned bridge-ingest profile's granted
# namespaces; the profile type lives here (a transitive dep of bridge-install).
arlen-permissions = { path = "../sdk/permissions" }
arlen-cookbook-sign = { path = "cookbook-sign" }
arlen-cookbook-index = { path = "cookbook-index" }
chrono = { version = "0.4", features = ["clock"] }
