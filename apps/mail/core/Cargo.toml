[package]
license = "AGPL-3.0-only"
name = "arlen-mail-core"
version = "0.1.0"
edition = "2021"
description = "The mail client's stated rules for the parts of MIME that the standard left ambiguous (mail-app.md section 2)"

[dependencies]
# LICENCE: Apache-2.0 OR MIT, pure Rust, no native dependency. Stalwart's parser,
# separable from their AGPL server - the crate itself is dual-licensed and that
# is what we take. Chosen rather than hand-rolled BECAUSE of section 2: a MIME
# parser written to avoid a dependency is a parser with its own undocumented
# differentials, and this module's whole job is to make the ambiguous cases a
# stated decision rather than an accident of whoever wrote the split.
mail-parser = "0.11"

[workspace]
