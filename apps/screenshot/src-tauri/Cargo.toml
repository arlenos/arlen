[package]
license = "AGPL-3.0-only"
name = "arlen-screenshot"
version = "0.1.0"
description = "Arlen OS screenshot app"
authors = ["Arlen"]
edition = "2021"

[lib]
name = "arlen_screenshot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri-plugin-arlen-shell = { path = "../../../sdk/tauri-plugin-shell" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
# Decode the annotated PNG the webview hands back for saving.
base64 = "0.22"
# Stamp the default screenshot filename backend-side.
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }
# The Wayland capture backend + the tested command logic (encode/save/decode/DTOs).
arlen-screen-capture = { path = "../../../sdk/screen-capture" }
arlen-screenshot-core = { path = "../core" }
# Put the annotated capture on the system clipboard as an image (RGBA offer); the
# wayland-data-control feature adds the wlr-data-control path for a Wayland session.
arboard = { version = "3", features = ["wayland-data-control"] }
