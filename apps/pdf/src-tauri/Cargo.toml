[package]
license = "AGPL-3.0-only"
name = "arlen-pdf-app"
version = "0.1.0"
description = "Arlen OS document reader - open a PDF, find your way around it, search inside it"
authors = ["Arlen"]
edition = "2021"

[lib]
name = "arlen_pdf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-arlen-shell = { path = "../../../sdk/tauri-plugin-shell" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arlen-pdf-core = { path = "../core" }
log = "0.4"
env_logger = "0.11"

# This app is its own standalone crate (not a member of a parent workspace).
[workspace]
