[package]
license = "AGPL-3.0-only"
name = "arlen-pdf-decode-page"
version = "0.1.0"
edition = "2021"
description = "The sandboxed PDF page renderer: reads a document on stdin, writes one page as an RGBA raster frame on stdout (quickview-plan.md)"

[[bin]]
name = "arlen-pdf-decode-page"
path = "src/main.rs"

[lib]
name = "arlen_pdf_decode_page"

[dependencies]
# This is the largest piece of native code the reader touches and it parses
# files people are sent by strangers, which is why it is a separate worker
# binary behind a sandbox rather than a function in the reader.
#
# PDFIUM, NOT MuPDF, AND THE REASON IS THE LICENCE RATHER THAN THE API. This
# crate shipped on `mupdf` for four commits and that was my mistake: MuPDF and
# its -sys crate are AGPL-3.0, the tree's licence gate rejects it by name, and
# the plan for this reader had already ruled it out in one line. I read that
# line as one option among several and reasoned that AGPL-in-AGPL is fine. It is
# not a call for me to make on a shipped desktop component, and the gate was
# right where I was wrong.
#
# `pdfium-render` is MIT OR Apache-2.0 over PDFium (BSD-3-Clause), the engine
# Chrome ships. It binds to a `libpdfium` at RUNTIME rather than vendoring C, so
# nothing here is compiled from an AGPL source tree - and where that library
# comes from on the image is a packaging question, named in the report rather
# than answered by a download in a build script.
pdfium-render = "0.9"
arlen-pdf-core = { path = "../core" }
# For the Landlock ruleset the viewer's decoders already use. One reviewed
# implementation of the confinement rather than a second copy of it here.
arlen-viewers-core = { path = "../../viewers/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]
