# The directory the login screen keeps its own state in.
#
# It holds one boolean - `this login screen was last used with a screen reader`
# - so a returning blind person is not made to find the same toggle at every
# boot. See `apps/greeter/core/src/a11y_state.rs` for why that bit lives here
# and not in anyone's user config.
#
# WITHOUT THIS FILE THE FEATURE IS DEAD ON A FRESH INSTALL, and it fails in the
# quiet way: `/var/lib/arlen` is 0755 root root, so the greeter's user cannot
# create a subdirectory under it however hard `create_dir_all` tries. Every
# write returns EACCES and the login screen tells the person, correctly and
# forever, that it could not save their choice. Same family as `user-dirs.dirs`
# - works everywhere except the machine nobody has set up yet.
#
# WHY tmpfiles AND NOT `StateDirectory=`. Every other component in this tree gets
# its state directory from its own unit; the config broker's
# `StateDirectory=arlen/config-broker` is the pattern. The greeter has no unit:
# greetd spawns it as the `[default_session]` command, so there is no service
# for systemd to create a directory for. tmpfiles is the only mechanism left.
#
# WHY `_greetd`, which is the part I would otherwise be guessing at. It is the
# system user greetd's own Debian package creates (`greetd.postinst`:
# `GREETDUSERGROUP=_greetd`, home `/var/lib/greetd`) and the user its shipped
# `/etc/greetd/config.toml` names for `[default_session]`. So this is read off
# the package rather than off a convention.
#
# AND THE USER MUST ALREADY EXIST WHEN THIS IS PROCESSED. A name systemd-tmpfiles
# cannot resolve does not fall back to root or to the calling user: the line is
# skipped and the directory is not created at all (checked against
# systemd-tmpfiles with a fake root, 14 Aug - `Failed to resolve user '_greetd'`
# and no directory, versus the same file with the user present creating
# /var/lib/arlen 0755 and greeter 0700). So the greetd package has to be
# installed before this runs, and a deployment that skips it gets exactly the
# EACCES this file exists to prevent, with an extra step in between.
#
# IT MUST MATCH the `user =` under `[default_session]` in the greetd config that
# actually launches the greeter. A deployment that runs the greeter as something
# else has to change this line with it, or the directory exists and the wrong
# process owns it - which fails exactly as silently as the directory not being
# there. Today this image's greetd runs `arlen-session` as `arlen` and starts no
# greeter at all, so nothing installs this file yet; it ships with the greeter so
# that whoever wires that up has it in hand rather than discovering the EACCES.
#
# 0700 because nothing else needs to read it. The leak this feature accepts is
# that the login screen shows the last person's choice to whoever walks up to the
# machine; there is no reason to widen it to every process on the system as well.
d /var/lib/arlen/greeter 0700 _greetd _greetd -
