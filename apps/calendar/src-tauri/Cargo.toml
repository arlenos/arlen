[package]
license = "AGPL-3.0-only"
name = "arlen-calendar-app"
version = "0.1.0"
description = "Arlen OS calendar - the agenda over the calendar files on your own machine"
authors = ["Arlen"]
edition = "2021"

[lib]
name = "arlen_calendar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-arlen-shell = { path = "../../../sdk/tauri-plugin-shell" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = { version = "5", default-features = false, features = ["tokio"] }
chrono = "0.4"
uuid = { version = "1", features = ["v7"] }
arlen-calendar-core = { path = "../core" }
log = "0.4"
notify = "7"
env_logger = "0.11"

# This app is its own standalone crate (not a member of a parent workspace).
[workspace]
