[package]
license = "AGPL-3.0-only"
name = "arlen-store-backend"
version = "0.1.0"
edition = "2021"
description = "Arlen app store backend: the catalog merge/dedup model and org.arlen.Store1 spine (store-app.md section 9)"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
# The forage recipe schema: the compose step maps a recipe to one catalog entry
# (store-app.md section 9.3), so a forage app lands in the same merged catalog.
arlen-forage-recipe = { path = "../contracts/forage-recipe" }

[dev-dependencies]
serde_json = "1"

[workspace]
