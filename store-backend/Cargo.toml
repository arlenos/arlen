[package]
license = "AGPL-3.0-only"
name = "arlen-store-backend"
version = "0.1.0"
edition = "2021"
description = "Arlen app store backend: the catalog merge/dedup model and org.arlen.Store1 spine (store-app.md section 9)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "arlen-store-backend"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The forage recipe schema: the compose step maps a recipe to one catalog entry
# (store-app.md section 9.3), so a forage app lands in the same merged catalog.
arlen-forage-recipe = { path = "../contracts/forage-recipe" }
# The org.arlen.Store1 socket transport (length-prefixed frames over AF_UNIX).
tokio = { version = "1", features = ["net", "io-util", "rt", "rt-multi-thread", "macros", "signal", "time"] }
# Read-only XML DOM for the Flathub composed-AppStream catalog reader (section 9.3).
roxmltree = "0.20"
# Decompress the deployed catalog metadata (Flathub/DEP-11 ship gzipped .xml.gz/.yml.gz).
flate2 = "1"
# Multi-document YAML for the Debian DEP-11 catalog reader (section 9.3).
serde_yaml = "0.9"

[dev-dependencies]
tokio = { version = "1", features = ["net", "io-util", "macros", "rt"] }

[workspace]
