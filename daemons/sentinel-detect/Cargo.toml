[package]
license = "AGPL-3.0-only"
name = "arlen-sentinel-detect"
version = "0.1.0"
edition = "2021"
description = "Physical-World Privacy Sentinel: the pure, testable detector logic (BLE tracker classification, exposure posture) the sentinel daemon drives"

[lib]
path = "src/lib.rs"

[dependencies]
# Derive only. The crate stays pure - it reads no file and opens no socket - but
# the tags it accumulates have to survive a suspend, and the daemon's encrypted
# store needs a shape to seal. Defining a second mirror of these types over there
# so this one could stay dependency-free would be the worse trade.
serde = { version = "1", features = ["derive"] }

[workspace]
