[package]
license = "AGPL-3.0-only"
name = "arlen-sentineld"
version = "0.1.0"
edition = "2021"
description = "The physical-world privacy sentinel: what this machine broadcasts about itself, and the switches that decide which detectors watch for it (privacy-sentinel-plan.md)"

[[bin]]
name = "arlen-sentineld"
path = "src/main.rs"

[lib]
name = "arlen_sentineld"
path = "src/lib.rs"

[dependencies]
# The detector cores. Pure, no radio, no I/O: this crate does the reading and
# hands the readings over, so the comparisons stay unit-testable without hardware.
arlen-sentinel-detect = { path = "../sentinel-detect" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The switches on disk. Same format as every other Arlen config.
toml = "0.8"
# NetworkManager and BlueZ are where the radio identity surface actually lives,
# and both speak the system bus. Same client every other Arlen daemon uses.
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "macros", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The socket authenticates its peer the way every other Arlen broker does, rather
# than with a second hand-rolled credential read.
arlen-permissions = { path = "../../sdk/permissions" }
# Turning a protection off is recorded before it happens.
audit-proto = { path = "../../contracts/audit-proto" }
libc = "0.2"
# The BLE watch. BlueZ's official Rust interface rather than hand-rolled zbus:
# an AdvertisementMonitor is an object BlueZ calls back INTO, not a proxy, so the
# D-Bus half is real work somebody has already done correctly.
bluer = { version = "0.17", features = ["bluetoothd"] }
futures = "0.3"
uuid = "1"
# The advisory events both watches publish. Same producer socket every other
# daemon uses; the payloads live in the shared event proto beside them.
os-sdk = { path = "../../sdk/os-sdk" }
prost = "0.13"
# SEN-4's sighting store. A tag's location history is the most sensitive thing this
# daemon touches, so it is sealed with the reviewed AEAD record store under a master
# held by the reviewed key custody, rather than a second hand-rolled pair.
arlen-secret-vault = { path = "../../sdk/secret-vault" }
arlen-forage-signing = { path = "../../forage/signing" }
hmac = "0.12"
sha2 = "0.10"
dirs = "5"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
# `MockAuditSink`, behind `test-util` on purpose: it accepts everything, which is
# the wrong thing to have in a release build.
audit-proto = { path = "../../contracts/audit-proto", features = ["test-util"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[workspace]
