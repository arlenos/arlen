[package]
license = "AGPL-3.0-only"
name = "arlen-session-supervisor"
version = "0.1.0"
edition = "2021"
description = "Starts the per-user Arlen daemons through systemd and keeps their identity registration current across restarts"

[lib]
path = "src/lib.rs"

[[bin]]
name = "arlen-session-supervisor"
path = "src/main.rs"

[dependencies]
arlen-permissions = { path = "../../sdk/permissions" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Default features, for the BLOCKING api: the seams this fills are synchronous
# (see src/systemd.rs), so a runtime here would be a moving part with nothing
# to move. Same reason lock-auth takes it this way.
zbus = { version = "5" }

[workspace]
