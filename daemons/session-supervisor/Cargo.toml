[package]
license = "AGPL-3.0-only"
name = "arlen-session-supervisor"
version = "0.1.0"
edition = "2021"
description = "Starts the per-user Arlen daemons through systemd and keeps their identity registration current across restarts"

[lib]
path = "src/lib.rs"

[[bin]]
name = "arlen-session-supervisor"
path = "src/main.rs"

[dependencies]
arlen-permissions = { path = "../../sdk/permissions" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[workspace]
