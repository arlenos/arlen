[package]
license = "AGPL-3.0-only"
name = "arlen-wine-core"
version = "0.1.0"
edition = "2021"
description = "What a Wine prefix reaches by default, and the drive map a capability-scoped bottle replaces it with (wine-proton-plan.md)"

[[bin]]
name = "arlen-bottled"
path = "src/main.rs"

[lib]
name = "arlen_wine_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
# The bottle IS a confinement, so the bwrap spec comes from the one crate that
# already builds them rather than a second hand-rolled argv. It also means the
# drive check below reads the real argv, not a private copy of it.
arlen-confiner = { path = "../../sdk/confiner" }
# The bottle description on disk. Same format as every other Arlen config.
toml = "0.8"
# Forgetting a bottle moves its prefix to the trash rather than unlinking it: the
# directory holds whatever the person installed and saved in there, and a window
# button that destroys that with no way back is not a button worth shipping.
arlen-freedesktop-trash = { path = "../../contracts/freedesktop-trash" }
# The socket: peer authentication (SO_PEERPIDFD + uid) is the same primitive
# every other broker in this tree authenticates with, rather than a second
# hand-rolled credential read.
arlen-permissions = { path = "../../sdk/permissions" }
# Forgetting a bottle throws away what somebody installed, so it goes in the
# ledger before it happens and is refused when the ledger cannot take it.
audit-proto = { path = "../../contracts/audit-proto" }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "macros", "signal", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"

[dev-dependencies]
# The examples build the launch argv, which needs the compat roots this crate
# resolves against the host.
arlen-confiner = { path = "../../sdk/confiner" }
# The wire format is pinned by a test that reads the bytes a caller would see.
tempfile = "3"
# `MockAuditSink`, for the test that a narrowing an unadmitted caller asked for is
# refused AND recorded. Gated behind `test-util` in the proto crate on purpose: it
# is an accepting sink, which is the wrong thing to have in a release build.
audit-proto = { path = "../../contracts/audit-proto", features = ["test-util"] }

[workspace]
