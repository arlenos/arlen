[package]
license = "AGPL-3.0-only"
name = "arlen-wallpaper"
version = "0.1.0"
edition = "2021"
description = "Arlen wallpaper: the data-only TOML manifest model (image / video / shader / dynamic, per-monitor + time-of-day variants, referencing plain asset files, no executable code) the background-layer client and the Settings picker share. The renderer client and the time-of-day selection build on this."
authors = ["Arlen"]

[lib]
name = "arlen_wallpaper"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "1"
# Static-wallpaper image decode for the renderer client (png + jpeg cover the
# wallpaper asset formats; the full image crate's codecs are not needed).
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# The wlr-layer-shell background client (WP-R1): smithay-client-toolkit gives the
# registry/output/layer-shell/shm boilerplate; the pixel pipeline (decode +
# Fill/Zoom compose) is the pure `decode` module this feeds into a wl_shm buffer.
smithay-client-toolkit = "0.19"
wayland-client = "0.31"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "arlen-wallpaperd"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"

[workspace]
