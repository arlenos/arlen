# Which backend the frontend routes each interface to, for a session whose
# XDG_CURRENT_DESKTOP is `arlen`.
#
# WHY THIS EXISTS BESIDE `portals/arlen.portal`. The `.portal` file says what this
# backend CAN serve; this file says what the frontend SHOULD pick. Until 1.18 the
# `UseIn=` line in the `.portal` did both, and it is deprecated - it still works
# in the 1.20.3 on our image, and gtk's own `.portal` still carries one in 1.22,
# but routing that rests on a deprecated key is how a thing becomes inert again
# at the next upgrade. That is the failure this whole chain was staged to fix, so
# it is not the mechanism to lean on.
#
# NAMED INTERFACES, NOT `default=`. Writing `default=arlen` would claim this
# backend is the preferred choice for every portal interface there is, which is
# false: it implements three. Verified against a real frontend (1.22.1, on the
# development host, XDG_DATA_DIRS pointed at a tree holding only these two
# files) - with `default=arlen` the frontend went looking for us to serve
# Lockdown and Access as well, found we do not implement them, and warned. With
# the three named it reports exactly:
#
#   Preferred portals for interface 'org.freedesktop.impl.portal.FileChooser': arlen
#   Preferred portals for interface 'org.freedesktop.impl.portal.OpenURI': arlen
#   Preferred portals for interface 'org.freedesktop.impl.portal.Screenshot': arlen
#
# Keep this list and the `Interfaces=` line in `portals/arlen.portal` in step. An
# interface named here that the backend does not implement costs a warning and a
# fallback; one implemented but not named here is simply never routed to us.
[preferred]
org.freedesktop.impl.portal.FileChooser=arlen
org.freedesktop.impl.portal.OpenURI=arlen
org.freedesktop.impl.portal.Screenshot=arlen
