[package]
name = "xdg-desktop-portal-arlen"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Arlen backend for xdg-desktop-portal (FileChooser, OpenURI)"

[[bin]]
name = "xdg-desktop-portal-arlen"
path = "src/main.rs"

[dependencies]
xdg-portal-arlen-protocol = { path = "../protocol" }
zbus = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
percent-encoding = { workspace = true }
libc = "0.2"
arlen-screen-capture = { path = "../../../sdk/screen-capture" }
# The org.freedesktop.impl.portal.Print backend (PRN-R2) bridges to the built
# arlen-print service (CUPS); this brings in JobOptions/Duplex/ColorMode + the
# submit surface. audit-proto supplies the ledger sink the print submit records to.
arlen-print = { path = "../../print", features = ["cups"] }
audit-proto = { path = "../../../contracts/audit-proto" }
# The consent-broker intake contract: the ScreenCast backend routes capture
# consent through the broker (on behalf of the capturing app) before streaming.
arlen-consent-contract = { path = "../../../contracts/consent-contract" }
arlen-launch-contract = { path = "../../../contracts/launch" }
# The org.freedesktop.impl.portal.Settings backend answers `color-scheme` and
# `accent-color` from the person's resolved theme, so it reads the same struct
# the shell renders from rather than a second copy of the resolution chain.
# `toml` is for the one key that is not in it: `[accessibility] reduce_motion`.
arlen-theme = { path = "../../../sdk/theme" }
toml = "0.8"

[dev-dependencies]
tempfile = "3"
# Polling the SettingChanged signal in the Settings real-bus test: zbus hands
# back a Stream and re-exports only futures-core, so the extension trait that
# awaits one comes from here.
futures-util = "0.3"
tokio = { workspace = true, features = ["test-util", "macros"] }
