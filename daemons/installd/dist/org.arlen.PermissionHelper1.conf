<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  System-bus access policy for the Arlen permission helper.

  permission-helper runs as root on the system bus (see dist/permission-helper
  .service) and writes the system permission profiles and the inode-keyed
  identity registry (F3 Rung B). Without this file the system bus default-denies
  both owning the name and sending to it, so the helper could not claim
  org.arlen.PermissionHelper1 and installd / settings could never reach it.

  Install to /usr/share/dbus-1/system.d/org.arlen.PermissionHelper1.conf

  The bus policy is only the coarse gate: any local user may send, and the helper
  authorizes every call itself - write_profile/delete_profile/record_identity run
  validate_caller. Owning the name is restricted to root so a non-root process
  cannot squat it and forge profiles.

  validate_caller is two checks of very different strength, and the difference
  matters here (dbus.rs:137 and :150):

    the uid check     kernel-attested via GetConnectionUnixUser: a caller may
                      write only for its own uid, or any uid as root. Real, and
                      it is what stops cross-user profile planting.
    the binary check  `exe_name.contains(c)` - a substring test on the basename
                      of /proc/<pid>/exe, so a same-uid process whose binary is
                      named `my-arlen-installd-thing` passes it.

  So the boundary a same-uid caller actually faces is a name match. That is
  load-bearing rather than belt-and-braces: the profiles written here are the
  SYSTEM tier, which wins outright over the user's own overlay, so getting past
  the name check is how a process would grant itself authority its user profile
  does not have. The anchored resolution that would close it was built and
  reverted pending a decision on installd's attested path (the F3 residual).
-->
<busconfig>
  <policy user="root">
    <allow own="org.arlen.PermissionHelper1"/>
  </policy>

  <policy context="default">
    <allow send_destination="org.arlen.PermissionHelper1"/>
  </policy>
</busconfig>
