[package]
license = "AGPL-3.0-only"
name = "arlen-clock"
version = "0.1.0"
edition = "2021"
description = "The clock daemon: alarms, timers, focus, stopwatch and world clocks, owned outside the GUI"

[lib]
path = "src/lib.rs"

[[bin]]
name = "arlen-clockd"
path = "src/main.rs"

[dependencies]
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v7"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dependencies.serde_json]
version = "1"

[dev-dependencies]
chrono-tz = "0.9"
tempfile = "3"

[workspace]
