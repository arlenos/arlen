[package]
license = "AGPL-3.0-only"
name = "arlen-clock"
version = "0.1.0"
edition = "2021"
description = "The clock daemon: alarms, timers, focus, stopwatch and world clocks, owned outside the GUI"

[lib]
path = "src/lib.rs"

[dependencies]
chrono = "0.4"
serde = { version = "1", features = ["derive"] }

[dependencies.serde_json]
version = "1"

[dev-dependencies]
chrono-tz = "0.9"

[workspace]
