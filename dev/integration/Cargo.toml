[package]
name = "arlen-integration"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[lib]
path = "src/lib.rs"

[dependencies]
tempfile = "3"
arlen-permissions = { path = "../../sdk/permissions" }

[dev-dependencies]
# The read half's three parties: the token contract mints and verifies, the
# terminal core carries the request shape and its serde defaults. The guard below
# asserts they agree on what a scope IS.
arlen-run-consent-token = { path = "../../contracts/run-consent-token" }
arlen-terminal-core = { path = "../../apps/terminal/core" }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
prost = "0.13"
# The uid-split scenario asks the kernel who this process is: it registers a
# consumer for uid+1, which is a uid no event in the run can carry, so the
# refusal needs no second real user on the machine.
libc = "0.2"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v7"] }
os-sdk = { path = "../../sdk/os-sdk" }
arlen-capsule = { path = "../../contracts/capsule" }
# The store scenario speaks the store socket through the client the app links,
# rather than hand-rolling its framing.
arlen-store-backend = { path = "../../store-backend" }
audit-proto = { path = "../../contracts/audit-proto" }
# The go-live undo rehearsal drives the agent's `org.arlen.AIAgent1` D-Bus
# interface (completed_actions -> compensate) and parses its JSON replies.
zbus = { version = "5", default-features = false, features = ["tokio"] }
# Wire types only (no `client` feature, so no second zbus): the alarm scenario
# watches the notification socket the way a shell does, and "was it broadcast"
# cannot be read from anywhere else - a suppressed notification is stored too.
notification-proto = { path = "../../contracts/notification-proto" }
# The alarm scenario seeds a wall-clock `HH:MM` at the next minute boundary,
# which is arithmetic on local time rather than on an instant.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde_json = "1"
# The consent/act round-trip drives the broker's intake + control sockets: submit
# a Confirm (arlen-consent-contract wire types), resolve it as the shell
# (arlen-consent-broker ControlClient), and ActionKind for the request kind.
arlen-consent-contract = { path = "../../contracts/consent-contract" }
arlen-consent-broker = { path = "../../daemons/consent-broker" }
arlen-ai-core = { path = "../../ai/ai-core" }
# The accessibility scenario speaks the config broker through the client the
# shell and Settings link, rather than hand-rolling its framing.
arlen-config-broker = { path = "../../daemons/config-broker" }
# The cross-profile transfer scenario builds the daemon's own `DualLedger` over
# two real per-profile ingest sockets, rather than restating its wire shape here.
transfer-daemon = { path = "../../daemons/transfer-daemon" }
# The credential scenario seeds the store through the daemon's own vault types,
# so the seed is sealed the way the daemon will read it.
connections = { path = "../../daemons/connections" }

[build-dependencies]
prost-build = "0.13"
