<!-- The control for `overlapping-text.js`.
     A probe that answers `[]` on a clean page and `[]` when it is broken is the
     same probe, and the only way to tell is to hand it something overlapping.

       dev/screenshot/shoot.sh "file://$PWD/dev/screenshot/overlapping-text-control.html" \
         /tmp/x.png dev/screenshot/overlapping-text.js 800 460

     must answer exactly one pair:

       ["\"the line beneath it\" over \"Painted over\" (83x17px)"]

     Six cases, and five of them must NOT come back: neighbours that touch, a
     label with a box behind it, two notices stacked as cards, a marker inside a
     wrapped span's bounding box, and a line a scroller cut away. Each of the
     last four was a false positive this probe actually produced, so each was
     checked BOTH ways - with the rule that silences it removed, every one of
     them is reported again.
-->
<body style="margin: 0; background: #111; color: #eee; font: 14px system-ui">
  <!-- The fault: two texts sharing the same painted area, which is what a starved
       grid column does to its neighbour. -->
  <div style="position: relative; height: 60px">
    <span style="position: absolute; left: 20px; top: 20px">the line beneath it</span>
    <span style="position: absolute; left: 40px; top: 20px">Painted over</span>
  </div>

  <!-- MUST NOT be reported: neighbours that merely touch. Adjacent boxes share an
       edge constantly, and reporting those would bury the real ones. -->
  <div style="display: flex">
    <span style="padding-right: 0">left half</span><span>right half</span>
  </div>

  <!-- MUST NOT be reported: a label with a decorative box behind it, which is a
       parent and not a leaf. -->
  <div style="background: #222; padding: 4px 8px; width: 200px">inside a box</div>

  <!-- MUST NOT be reported: two notices in a stack, each on its own filled card,
       the way a toast deck draws itself. Their boxes overlap almost entirely and
       nothing is illegible: the front card covers the back one, which is the
       whole point of the pattern. The shell reported this at three widths before
       the probe learned to look for an opaque box between two texts. -->
  <div style="position: relative; height: 70px">
    <div style="position: absolute; top: 14px; left: 20px; width: 260px; background: #1d2b1d; padding: 8px">
      <span>The notice behind the front one</span>
    </div>
    <div style="position: absolute; top: 10px; left: 20px; width: 260px; background: #2b1d1d; padding: 8px">
      <span>The notice in front</span>
    </div>
  </div>

  <!-- MUST NOT be reported: a marker sitting in the gap a WRAPPED span leaves at
       the end of its first line. The span's bounding rect is the union of both
       lines - a tall box across the whole column - and the marker is inside it
       while nothing is painted over anything. This is markdown rendered with its
       own syntax beside the styled text, which the editor does on every bold
       run. -->
  <div style="width: 220px; line-height: 21px">
    This file is a <span style="color: #777">**</span><b>first-class citizen of the graph</b><span style="color: #777">**</span> today.
  </div>

  <!-- MUST NOT be reported: a line a scroll container has cut away. Its box still
       sits where the layout put it, straight through the heading, and nothing of
       it is painted. This is the calendar's hour labels, which cost me a morning
       on 5 September before the probe learned to intersect with its clippers. -->
  <div style="position: relative; height: 40px">
    <span style="position: absolute; left: 20px; top: 10px">a heading in the clear</span>
  </div>
  <div style="height: 20px; overflow: hidden">
    <span style="position: relative; left: 20px; top: -32px">cut away by the scroller</span>
  </div>
</body>
