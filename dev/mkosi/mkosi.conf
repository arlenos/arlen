# The minimal bootable Arlen image - a Debian Trixie UEFI disk image that boots
# the compositor + shell + daemons + login, run as a QEMU system-under-test to
# verify the whole assembled stack (boot -> QMP-inject -> screendump -> inspect).
# Approach + the ranked hard parts in `docs/architecture/minimal-image-vm-build-plan.md`.
#
# Build:  mkosi --directory dev/mkosi build
# Boot:   mkosi --directory dev/mkosi vm        (a real kernel/DRM path; `boot`/`shell` are nspawn, no GPU)
# or drive it through the verify harness (dev/vm/, QMP screendump + input).
#
# NB on the Arch dev box mkosi defaults to the HOST distro, so [Distribution]
# below is mandatory; ToolsTree=default carries the Debian apt/dpkg/debootstrap.

[Distribution]
Distribution=debian
Release=trixie
# AMD GPU firmware (harmless on the software-GL VM path; needed on real metal).
Repositories=non-free-firmware

[Output]
# Only `disk` carries a GPT + ESP, i.e. a bootable UEFI image; `directory`/`tar`
# are not bootable on their own.
Format=disk
ImageId=arlen

[Content]
# `yes`, never `auto`: auto silently yields a non-bootable image when the kernel
# or bootloader is not pulled in.
Bootable=yes
Bootloader=systemd-boot
# The kernel + sd-boot EFI stub are NOT auto-pulled; name them explicitly. The
# Wayland/Mesa(llvmpipe)/WebKitGTK runtime libs are the stack's display
# dependencies (verify the exact names on a real build, per the plan).
Packages=
        linux-image-amd64
        systemd
        systemd-sysv
        systemd-boot-efi
        udev
        # kmod provides depmod, which the kernel postinst + mkosi's module pass
        # invoke; not pulled implicitly into the rootfs, so name it (first-build
        # finding: "depmod not found" else fails the image at the module step).
        kmod
        # PAM: the modules (pam_permit/pam_loginuid/pam_unix), the base config
        # framework, and pam_systemd (creates the logind session + XDG_RUNTIME_DIR
        # the compositor needs). greetd's pam_start fails closed without these.
        libpam-runtime
        libpam-modules
        libpam-systemd
        dbus-broker
        # polkitd answers logind's authorization questions, and without it every
        # one of them is refused. That is not a hardening default we chose: Debian's
        # systemd neither Depends nor Recommends polkit (checked against the built
        # image's own /var/lib/dpkg/status, 12 Aug), so it was never going to arrive
        # - the same shape as bubblewrap and at-spi2-core below, a capability the
        # system assumes and nothing declares.
        #
        # What it costs to leave out: the shell's power menu runs `systemctl
        # suspend|reboot|poweroff` as the desktop user, each of which is a logind
        # call needing authorization. With no polkitd on the bus the check cannot
        # be answered and logind denies, so Shut Down does nothing at all. Only a
        # uid-0 caller is short-circuited past the question, and the shell is not one.
        #
        # The daemon alone is enough, no authentication agent: power-off, reboot,
        # suspend and hibernate are all `allow_active=yes`, and the shell runs inside
        # the greetd/PAM login session, so it is the active session rather than a
        # subject needing an admin prompt.
        #
        # It does NOT fix the lid. `arlen-powerd` is a user unit, which puts it in
        # user@.service and therefore outside the session scope, where the policy's
        # `allow_any` applies - and for inhibit-handle-lid-switch that is `no`. So
        # PWR-R4's dock-aware takeover stays denied until the daemon is moved into
        # the session or granted the action explicitly; its fallback is safe (logind
        # keeps handling the lid), which is why this was quiet.
        #
        # NB the presence of /usr/share/polkit-1/actions proves nothing about any of
        # this: systemd ships its own action definitions, so the policy files are on
        # the image while polkitd is not. Ask for the daemon, not for the policy.
        polkitd
        # bubblewrap is the sandbox every confined child runs under: the pi engine
        # sidecar and the terminal-run server's run_command both exec `bwrap`. It
        # currently arrives TRANSITIVELY, so the whole confinement story depends on
        # a dependency nobody declared - if that provider ever drops it, both paths
        # break at spawn with a bare "No such file or directory". Name it.
        bubblewrap
        # xdg-desktop-portal is the FRONTEND, and our portal is a BACKEND. Apps
        # dial `org.freedesktop.portal.Desktop`, which this package owns; it
        # authenticates the caller, then re-dispatches to whichever impl backend
        # a `.portal` file claims the interface. Ours claims FileChooser, OpenURI
        # and Screenshot with `UseIn=arlen`, and `daemons/session/src/env.rs:67`
        # sets `XDG_CURRENT_DESKTOP=arlen`, so the routing key matches.
        #
        # What it costs to leave out: everything. With no frontend on the bus,
        # nothing ever dials the backend, so a file dialog from a confined app
        # has no answer at all - and the three security fixes on that path (the
        # OpenFile descriptor TOCTOU, the resolved-mount containment, the picker
        # peer-credential check) are shipped code that cannot execute. A fix that
        # cannot run is the same class of untruth as a surface reporting a write
        # it never made.
        #
        # It does not arrive transitively. Checked on 18 Aug by grepping the
        # dpkg status out of the built `arlen.raw` itself rather than reasoning
        # about dependencies: zero stanzas for `xdg-desktop-portal` in any
        # variant. Same shape as polkitd, bubblewrap and fontconfig here - a
        # capability the system assumes and nothing declares.
        xdg-desktop-portal
        # fontconfig for `fc-list`, which Settings shells out to for the font
        # picker. It is on the image today only as a dependency of the GTK stack,
        # so the picker rests on something nobody declared - the same shape as
        # bubblewrap above and at-spi2-core below. Named on 12 Aug when
        # `check-runtime-deps.py` asked the question for the first time.
        fontconfig
        # at-spi2-core provides the accessibility bus launcher + registry daemon
        # (/usr/libexec/at-spi-bus-launcher, org.a11y.Bus). Without it a GTK app
        # links libatspi - which arrives transitively - and then registers with
        # nothing, so the tree is empty and every query answers "not found". That
        # is the boot gate's worst possible failure: it looks exactly like a
        # dialog that is genuinely absent. Verified missing from the built image
        # with guestfish: libatspi.so.0 was present, /usr/libexec held only
        # coreutils/dconf/dpkg/glib-pacrunner, and no org.a11y.Bus.service existed
        # anywhere under /usr/share/dbus-1.
        at-spi2-core
        greetd
        seatd
        libseat1
        fuse3
        # display + GPU (software GL via llvmpipe on the VM's plain virtio-gpu)
        libgl1-mesa-dri
        libegl1
        libgles2
        libwayland-client0
        libwayland-server0
        libwayland-egl1
        libxkbcommon0
        # xkb-data is the keymap DATA libxkbcommon compiles from - the rules,
        # symbols and geometry under /usr/share/X11/xkb. The library without it
        # resolves no layout at all, so this is every keystroke on the machine,
        # not a nicety.
        #
        # It is on the image today (verified with guestfish against arlen.raw:
        # rules/evdev.lst and symbols/de both present, dpkg says install ok
        # installed) purely as a dependency of the graphical stack. Same shape as
        # bubblewrap and fontconfig above: a capability the system assumes and
        # nothing declares. It is also what the Settings keyboard picker reads
        # (`commands/layouts.rs` parses rules/evdev.lst and answers with an empty
        # list when the rules are absent), so losing it would present a layout
        # chooser with nothing to choose and no error.
        #
        # NB the compositor still warns "no TOML [xkb_config], no
        # XKB_DEFAULT_LAYOUT env, no localectl entry, no /etc/vconsole.conf
        # KEYMAP" on this image, because none of those four is configured - that
        # is the DEFAULT being unset, a first-boot question, and is separate from
        # the keymap data being installed. Naming this package does not answer it.
        xkb-data
        # cosmic-comp's other runtime .so deps (build had the -dev; the image needs
        # the runtime libs): GBM, libinput, pixman, libdisplay-info (libseat1 +
        # libxkbcommon0 + libudev1 are already present via libseat1/above/udev).
        libgbm1
        libinput10
        libpixman-1-0
        libdisplay-info2
        # the Tauri shell/apps run on WebKitGTK; the shell's top bar uses
        # gtk-layer-shell (libgtk-layer-shell0 at runtime).
        libwebkit2gtk-4.1-0
        libgtk-3-0
        libgtk-layer-shell0
        # the viewer's HEIC decoder links libheif (build had libheif-dev). Without
        # the runtime lib the decoder cannot start, and a picture format the
        # desktop entry claims fails at the moment someone opens one.
        libheif1
        # libheif itself decodes nothing: the codecs are separate plugin packages,
        # and BOTH are load-bearing here because `decode-heic` serves two of the
        # desktop entry's claimed types - image/heic is HEVC (libde265) and
        # image/avif is AV1 (dav1d), which `core/src/lib.rs` routes to the same
        # worker. They arrive as Recommends of libheif1 today, and this file's own
        # rule for xdg-user-dirs applies: something a claimed format depends on is
        # named here, not left to another package's suggestion list.
        libheif-plugin-libde265
        libheif-plugin-dav1d
        # llama-server (the baked AI inference engine) is built with GGML's OpenMP
        # CPU threading, so it dynamically needs libgomp.so.1 at runtime; without
        # it the binary fails to start (status 127, missing shared library) and the
        # whole AI completion path is dead.
        libgomp1
        # a font so OCR/text assertions have glyphs to read
        fonts-dejavu-core
        # Named here rather than left to chance. It was already arriving as a
        # Recommends of the GTK stack, but `arlen-session` runs
        # `xdg-user-dirs-update` at every session start to give the user's folders
        # their names in the user's language - and a first-run correctness step
        # must not depend on another package's suggestion list.
        xdg-user-dirs

# Console on ttyS0 ONLY (not tty0): the kernel + systemd log stream to the serial
# port (the headless boot-chain verification channel), while the virtio-gpu VT
# (vt1) is left clean for greetd + cosmic-comp to own as the graphical session -
# console=tty0 would paint the kernel log onto the compositor's scanout. (getty@
# tty1 is masked for the same reason.) systemd.firstboot=off skips the interactive
# first-boot wizard (else it hangs a headless VM; a Hostname is baked below).
# systemd.journald.forward_to_console=1 streams the journal (incl. the systemd-cat'd
# compositor output) to ttyS0, so this verify SUT is diagnosable headlessly.
KernelCommandLine=console=ttyS0,115200 systemd.firstboot=off systemd.journald.forward_to_console=1
Hostname=arlen

[Build]
# CRITICAL on a non-Debian host: carries apt/dpkg/debootstrap so the Debian
# rootfs can be assembled (mkosi#1306). Without it the build fails "apt not found".
ToolsTree=default
# mkosi.build needs network for apt (build deps) + cargo (crate fetch). The build
# overlay is thrown away, so these tools never reach the final image.
WithNetwork=yes
# Mount the arlen repo root (two up from this config dir) into the build at
# $SRCDIR/arlen so mkosi.build.d can compile the Debian-native binaries from
# source; $SRCDIR itself is only this dev/mkosi config dir. The compositor is a
# separate repo (cosmic-comp fork), mounted alongside at $SRCDIR/compositor.
BuildSources=../../:arlen
BuildSources=../../../compositor:compositor
BuildSources=../../../pi:pi

[Runtime]
# UEFI, not auto - avoids Secure-Boot enrollment friction. KVM=auto falls back to
# TCG where /dev/kvm is absent (CI). The graphics/QMP wiring for the verify pass
# is driven by dev/vm/ (plain virtio-gpu, no gl=on, QMP screendump + usb-tablet),
# not from here, so the framebuffer stays CPU-readable.
Firmware=uefi
KVM=auto
