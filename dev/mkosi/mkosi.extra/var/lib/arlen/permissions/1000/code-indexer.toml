# The code indexer's event-bus profile.
#
# WRITTEN BEFORE IT BROKE, which is the only reason it is not another silent
# failure. Publish exemption stopped following the install tier on 14 Aug, so a
# producer is now held to what it declares - and this daemon declared nothing
# while `daemons/code-indexer/src` emits `code.indexed`. It has no profile at
# all, so the grant would have been empty and the event dropped, with nothing
# said to the producer.
#
# The boot that measured the publish half did not catch it: the daemon connects
# as a CONSUMER at startup and only publishes once it has actually indexed
# something, which nothing on a bare boot triggers. So the first symptom would
# have been the code graph quietly never filling, on a machine where every log
# line looks healthy. Found instead by listing every id the bus resolved against
# every profile that exists, and asking which resolved ids have no file.
#
# Both halves measured rather than guessed. `code.indexed` is the one emit in its
# source; `file.opened` is what it registered for on the 14 Aug boot
# (`consumer registered app_id="code-indexer" ... subscribed=["file.opened"]`),
# which is how it learns there is something to index.
# WHERE ITS FILE READS ARE BOUNDED, since this profile does not bound them. The
# indexer opens source files by path (`main.rs:186`), and the paths come from
# `file.opened` - so its reach is every file the person has opened. There is no
# `[filesystem]` section here and one would be inert anyway: this is a systemd
# user service, not an `arlen-run` launch, and filesystem grants are the
# launcher's mechanism.
#
# The real bound is its unit: `ProtectSystem=strict` and `ProtectHome=read-only`
# (`daemons/code-indexer/dist/arlen-code-indexer.service`), which is read-only
# access to the home it indexes and no write anywhere outside its own state. That
# is the right shape for an indexer, and it is written here because a reader of
# this file would otherwise see only an event-bus grant and conclude the daemon
# touches no files at all.

[info]
app_id = "code-indexer"
tier = "first-party"

[event_bus]
publish = ["code.indexed"]
subscribe = ["file.opened"]

# The graph read, granted rather than left to the tier.
#
# `refresh_roots_if_stale` asks the knowledge daemon one question:
#
#   MATCH (p:Project) WHERE p.expired_at IS NULL AND p.root_path IS NOT NULL
#   RETURN p.root_path AS root
#
# and the answer is what stops this indexer walking the whole disk - an
# unavailable graph keeps the previous roots rather than widening.
#
# IT WORKS TODAY WITHOUT THIS SECTION, and that is the reason to write it. The
# knowledge daemon's read gate lets a system-anchored caller past the label check
# on its TIER, so this query is admitted because of what the binary is rather
# than because anybody granted it. A grant makes the read checkable - the
# `check-read-grants-cover-queries` gate reads the Cypher and the grant together -
# so a future query touching a field nobody granted is caught here rather than
# after a stricter gate lands.
#
# Both fields the query names, and nothing else.
[graph]
read = [
    "system.Project.root_path",
    "system.Project.expired_at",
]
