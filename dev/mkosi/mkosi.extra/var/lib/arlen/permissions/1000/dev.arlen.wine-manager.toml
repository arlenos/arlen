# The bottle window's profile, under the uid it applies to, like every other app.
#
# NARROW ON PURPOSE, and narrower than the app will end up being. The grants
# below cover what the code does, not what the plan describes - a profile written
# against a feature that has not landed is a grant nobody can point at a caller
# for.
#
# THIS WINDOW WRITES, and the sentence here used to say it only reads. Three
# commands mutate: `wine_repair` rewrites the drive letters in a prefix,
# `wine_revoke` removes one, and `wine_forget` moves a bottle's files to the
# trash. They were registered before this profile was reviewed and the prose
# stayed behind; corrected 21 August after reading `lib.rs` rather than the
# comment above it.
#
# Each grant below was read out of the source, not assumed:
#
#   custom = the bottles dir    `dir()` (src-tauri/src/lib.rs) resolves
#                               `$XDG_DATA_HOME/arlen/bottles`, falling back to
#                               `~/.local/share`, and `wine_bottles` reads the
#                               `bottle.toml` in each subdirectory. The three
#                               writing commands land here too, BY CONVENTION:
#                               `prefix_for` puts a bottle's prefix at
#                               `<bottles>/<id>/pfx`, beside its description.
#
#   custom = the home trash     `wine_forget` moves a bottle's files there
#                               through `trash_for_current_user`, which for
#                               anything under the home directory resolves to
#                               `$XDG_DATA_HOME/Trash`. Without this the button
#                               is refused at the last step, after the window has
#                               already said what it is about to do.
#
# A BOTTLE CAN POINT ITS PREFIX ANYWHERE, and this grant does not follow it.
# `prefix_root` is a path in `bottle.toml`, so a hand-written description naming
# a prefix outside the bottles directory would have its repair refused here. That
# is the safe direction - a repair is a write, and a write outside the app's one
# directory should need a decision - but it is a refusal a person would meet
# without an explanation, so it is written down rather than discovered.
#
# WHAT IS DELIBERATELY ABSENT, and what it will cost when the rest lands:
#
# NO home grant. The window shows the granted paths as text and never opens one.
# Picking a folder to grant is a portal job when it arrives, not a home bind.
#
# NO network. Nothing here reaches out. A bottle's own egress is a property of
# the bottle and is enforced by the launcher around the Windows program, not by
# this window.
#
# NO `[graph]`. Which bottle exists and what it may reach is recorded in
# `bottle.toml`, not in the knowledge graph. Whether a capability browser should
# see bottles through the graph instead is a design question in
# `living-capability-graph.md`, and answering it with a grant here in advance
# would be answering it silently.
#
# NOT YET GRANTED, and named so the gap is visible rather than discovered: making
# a bottle spawns `wineboot`, and launching one spawns `bwrap` around `wine`.
# Both are absent from the image (`runtime-deps.tsv` says so), and neither is
# called from this process yet. When the daemon that does it exists, its grants
# are decided against that code.
[info]
app_id = "dev.arlen.wine-manager"
tier = "first-party"

[filesystem]
custom = [
    "$HOME/.local/share/arlen/bottles",
    "$HOME/.local/share/Trash",
]

# Event-bus scopes for the shadow-to-enforce cutover (`ARLEN_EVENT_BUS_ENFORCE`,
# off by default).
#
# NOTHING IS PUBLISHED: there is no emitter in this app.
#
# The subscribe list is not this app's own code: `sdk/tauri-plugin-shell`
# subscribes these three from inside every Tauri process, and declaring any
# subscribe list drops the system-tier exemption - so omitting them would
# silently switch off the topbar menu, the toolbar and the shortcuts while the
# subscribe still returns Ok.
[event_bus]
publish = []
subscribe = [
    "app.menu.*",
    "app.toolbar.action_invoked",
    "app.shortcut.action_invoked",
]
