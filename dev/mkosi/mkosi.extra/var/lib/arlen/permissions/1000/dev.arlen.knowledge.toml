# The knowledge app's KG profile, under the uid it APPLIES to:
# /var/lib/arlen/permissions/1000/<app_id>.toml, not the reading daemon's uid
# (decided 11 Aug - the root daemon acting for user 1000 and the user's own
# launcher have to resolve the same file, and keying on the reader gave them two).
# Without one the read scope is empty and every surface in this app - the timeline,
# projects, search, provenance - is denied, which renders as an app that opens onto
# nothing. The app_id comes from the install path the image uses
# (/usr/lib/arlen/apps/dev.arlen.knowledge/), which is what resolver rule (3) reads.
#
# The read list is the fields the app actually asks for, taken from its own
# queries rather than granted by label: Event (window focus) and File (accesses)
# make the timeline, Project makes the project list and the timeline's project
# column.
#
# This used to say `e.type` was left out because a filter is not a returned field
# and "the scope covers what is read back". Filters are listed now, and the
# reasoning changed on 11 Aug after reading how the scope is consumed:
# `readable_system_labels` (daemon.rs:793) strips the field off every pattern and
# keeps the LABEL, so the field half of `system.Event.type` is not enforced
# anywhere on the read path today. It is documentation - and documentation of
# what a query touches is more useful than documentation of what it returns,
# because a filter is exactly the field a later field-level gate would deny while
# the query still looks like it should work. The terminal's profile had been
# granting its own filter-only `expired_at` all along.
#
# It also DELETES, which no other app profile here does. That is deliberately not
# a graph write scope: the daemon gates `delete_activity` on an exact caller match
# (`activity_delete_caller_admitted`), because the operation is not "write to the
# graph" but "destroy the user's own records", and a scope wide enough to express
# it would be wider than the act. Nothing in this file grants it and nothing here
# needs to; the profile is what the app may READ.
[info]
app_id = "dev.arlen.knowledge"
tier = "first-party"

[graph]
read = [
    "system.Event.id",
    "system.Event.title",
    "system.Event.source",
    "system.Event.timestamp",
    # The timeline names the app that held focus (`timeline.rs:139` returns
    # e.app_id beside id, title, source and timestamp), so the column it renders
    # was not in the grant. Added 11 Aug on a pass that read the queries and
    # compared the grants to them, rather than the other way round.
    "system.Event.app_id",
    # The timeline selects on the event type (`WHERE e.type = 'window.focused'`),
    # a filter-only field like Project.expired_at below.
    "system.Event.type",
    "system.File.id",
    "system.File.path",
    "system.File.app_id",
    "system.File.last_accessed",
    "system.Project.id",
    "system.Project.name",
    "system.Project.root_path",
    "system.Project.created_at",
    # Filter-only, and that is exactly why it was missing: `search.rs:160` and
    # `projects.rs:91` both open with `p.expired_at IS NULL` to keep archived
    # projects out, and the field never appears in a returned row. The terminal's
    # profile grants its own filter-only `expired_at` for the same reason.
    #
    # Like the two above, inert today: `dev.arlen.knowledge` is in the first-party
    # set, so the caller is system-anchored and the read-scope gate does not apply.
    # The grant is here so the profile describes the app, not so anything changes
    # this week.
    "system.Project.expired_at",
]

# Event-bus scopes: NONE, and stated rather than omitted.
#
# This file is the knowledge APP's profile - a first-party GUI over the graph
# (its app_id comes from the /usr/lib/arlen/apps/ install path, as the header
# says). It opens no bus connection at all: nothing under apps/knowledge
# subscribes, and nothing emits.
#
# It used to carry `subscribe = ["*", "permission.*", "ai.*", "schema.*"]` and
# `publish = ["project.*"]`, under a careful comment about the graph writer
# (`writer.rs:68`), the config consumer (`events.rs:38`) and the project emitter
# (`project/emitter.rs`). Every one of those lives in daemons/knowledge. The
# DAEMON's scopes had been filed on the APP's profile, which is the tier
# separation collapsing quietly: an app carrying a service's authority may
# publish what only the service should.
#
# The daemon never loaded this file in the first place, which is the part worth
# knowing before anyone worries about the removal. `identity.rs` carries an
# explicit override for its binary: /usr/bin/arlen-graph-daemon resolves to the
# app id `knowledge` (not `graph-daemon`, which rule 2 alone would give, and not
# `dev.arlen.knowledge`). So it looks for `knowledge.toml`, which the image does
# not ship. These grants were addressed to a principal that never asked for them.
#
# It keeps working regardless: /usr/bin/arlen-* is System tier at the bus, which
# is exempt from the publish gate outright and from the subscribe gate as long as
# it declares nothing. If it ever gains a profile, the filename is `knowledge.toml`
# and the reasoning worth carrying across is this: `*` and `permission.*` do NOT cover each other.
# A grant of `*` has no `.*` suffix to strip, so it is compared by equality and
# matches only a request for `*`. Both registrations need naming explicitly, and
# getting it wrong looks like a working system with an empty graph.
#
# DECLARED-AND-EMPTY, not absent. The subscribe exemption hangs on declaring
# (`declares_subscribe` is `subscribe.is_some()`), so deleting this section would
# make a system-tier app exempt and hand it the machine-wide view - the opposite
# of the intent. An empty list is how a profile says "hears nothing", and the
# reach summary has an arm that renders it exactly that way.
# MEASURED, not guessed. Stripping this to `subscribe = []` and booting with
# enforce on named the consumer that was actually there (14 Aug):
#
#   subscribe denied, filtering pattern app_id="dev.arlen.knowledge"
#     pattern=app.toolbar.action_invoked
#   subscribe denied, filtering pattern app_id="dev.arlen.knowledge"
#     pattern=app.shortcut.action_invoked
#
# and the app then registered with `subscribed=[]` - hearing nothing. Those two
# are the whole of what it consumes; the boot is the proof, since the bus logs
# every pattern a peer asks for.
#
# THEY ARE NOT THIS APP'S CODE. `sdk/tauri-plugin-shell` subscribes them from
# inside every Tauri app's own process (`spawn_action_invoked_consumer`), which
# is how a Quick Action or Breadcrumb click in the shell's top bar reaches an app
# that the shell has no webview handle for. So the profile of any app linking
# that plugin has to name them, and reading only the app's own source will always
# miss them - which is exactly how this got written as empty.
#
# The failure is silent by construction: `subscribe` returns Ok, the patterns are
# filtered out, and the plugin's self-healing loop waits on a receiver that never
# yields. Toolbar buttons and shortcuts simply stop working, with nothing in the
# app to say why.
#
# `publish = []` is honest but inert: `hold_to_scope = !is_system`
# (event-bus `socket.rs:204`) and this app installs under /usr/lib/arlen/, which
# `detect_tier` calls System, so a publish scope is not consulted for it today.
[event_bus]
publish = []
subscribe = ["app.toolbar.action_invoked", "app.shortcut.action_invoked"]
