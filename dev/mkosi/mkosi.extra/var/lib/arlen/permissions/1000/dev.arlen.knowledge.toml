# The knowledge app's KG profile. The daemon runs as root (uid 0) and resolves a
# caller's profile under /var/lib/arlen/permissions/<its own uid = 0>/<app_id>.toml;
# without one the read scope is empty and every surface in this app - the timeline,
# projects, search, provenance - is denied, which renders as an app that opens onto
# nothing. The app_id comes from the install path the image uses
# (/usr/lib/arlen/apps/dev.arlen.knowledge/), which is what resolver rule (3) reads.
#
# The read list is the fields the app actually asks for, taken from its own
# queries rather than granted by label: Event (window focus) and File (accesses)
# make the timeline, Project makes the project list and the timeline's project
# column.
#
# This used to say `e.type` was left out because a filter is not a returned field
# and "the scope covers what is read back". Filters are listed now, and the
# reasoning changed on 11 Aug after reading how the scope is consumed:
# `readable_system_labels` (daemon.rs:793) strips the field off every pattern and
# keeps the LABEL, so the field half of `system.Event.type` is not enforced
# anywhere on the read path today. It is documentation - and documentation of
# what a query touches is more useful than documentation of what it returns,
# because a filter is exactly the field a later field-level gate would deny while
# the query still looks like it should work. The terminal's profile had been
# granting its own filter-only `expired_at` all along.
#
# It also DELETES, which no other app profile here does. That is deliberately not
# a graph write scope: the daemon gates `delete_activity` on an exact caller match
# (`activity_delete_caller_admitted`), because the operation is not "write to the
# graph" but "destroy the user's own records", and a scope wide enough to express
# it would be wider than the act. Nothing in this file grants it and nothing here
# needs to; the profile is what the app may READ.
[info]
app_id = "dev.arlen.knowledge"
tier = "first-party"

[graph]
read = [
    "system.Event.id",
    "system.Event.title",
    "system.Event.source",
    "system.Event.timestamp",
    # The timeline names the app that held focus (`timeline.rs:139` returns
    # e.app_id beside id, title, source and timestamp), so the column it renders
    # was not in the grant. Added 11 Aug on a pass that read the queries and
    # compared the grants to them, rather than the other way round.
    "system.Event.app_id",
    # The timeline selects on the event type (`WHERE e.type = 'window.focused'`),
    # a filter-only field like Project.expired_at below.
    "system.Event.type",
    "system.File.id",
    "system.File.path",
    "system.File.app_id",
    "system.File.last_accessed",
    "system.Project.id",
    "system.Project.name",
    "system.Project.root_path",
    "system.Project.created_at",
    # Filter-only, and that is exactly why it was missing: `search.rs:160` and
    # `projects.rs:91` both open with `p.expired_at IS NULL` to keep archived
    # projects out, and the field never appears in a returned row. The terminal's
    # profile grants its own filter-only `expired_at` for the same reason.
    #
    # Like the two above, inert today: `dev.arlen.knowledge` is in the first-party
    # set, so the caller is system-anchored and the read-scope gate does not apply.
    # The grant is here so the profile describes the app, not so anything changes
    # this week.
    "system.Project.expired_at",
]

# Event-bus scopes, for the shadow-to-enforce cutover (`ARLEN_EVENT_BUS_ENFORCE`,
# off by default). This daemon is the one with most to lose: under enforce an
# absent scope means the graph writer receives nothing and the knowledge graph
# stops being fed, silently, while everything else still looks alive.
#
# ONE process, TWO consumer registrations, and the bus resolves both connections
# to the same app_id and the same profile - so this is their union, not a choice:
#
#   *                        the graph writer (`writer.rs:68`). It stores every
#                            event and lets the promotion pipeline decide later
#                            what is worth keeping, so its request really is the
#                            whole band and the grant has to say so.
#   permission.*, ai.*,      the config/authority consumer (`events.rs:38`):
#   schema.*                 permission changes invalidate the token cache, the
#                            AI level gates the agent's reach, schema changes
#                            reload the registry.
#
# Both are needed and neither covers the other. A grant of `*` matches ONLY a
# request for `*` - it is compared by equality, having no `.*` suffix to strip -
# so it would not admit `permission.*`, and `permission.*` would not admit the
# writer's `*`. That is pinned in the resolver's own tests rather than left to a
# reading, because getting it wrong looks like a working system with an empty
# graph.
#
# publish is the project lifecycle the detector emits (`project/emitter.rs`).
# Granted as the family: created/updated/archived are one contract with one
# producer, and a fourth verb in it would otherwise be a silent denial.
[event_bus]
publish = [
    "project.*",
]
subscribe = [
    "*",
    "permission.*",
    "ai.*",
    "schema.*",
]
