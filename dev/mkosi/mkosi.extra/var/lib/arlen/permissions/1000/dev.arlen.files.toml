# The file-manager's KG read profile. The knowledge daemon runs as root (uid 0)
# and resolves a caller's profile under /var/lib/arlen/permissions/<its own uid =
# 0>/<app_id>.toml; without a profile a caller's read scope is empty and every
# KG-backed FM feature (Recent, the file's Project, provenance, the Ask facets)
# is denied. The app_id is the file-manager's bundle identifier (dev.arlen.files,
# apps/files/src-tauri/tauri.conf.json); confirm it matches the daemon's
# path_to_app_id resolution of the installed binary if the install path differs.
#
# READ-ONLY and narrow on purpose: the FM only READS the graph (verified against
# apps/files/src-tauri - lib.rs reads File->Project via FILE_PART_OF and
# read_provenance, facet_query reads File path/last_accessed). It never writes,
# so there are no `relations` and no write scope. Erring narrow is the safe
# direction: a missing scope degrades a read-feature, an extra scope is a leak.
[info]
app_id = "dev.arlen.files"
tier = "first-party"

[graph]
read = [
    "system.File.id",
    "system.File.path",
    "system.File.last_accessed",
    "system.Project.id",
    "system.Project.name",
    # The Ask facets offer the apps that touched a file as an answerable
    # question, over `MATCH (a:App) RETURN a.id` (lib.rs:790). Without this the
    # query is denied and the facet list comes back empty, which reads as "no app
    # ever opened anything" rather than as a missing grant. Only the id: that is
    # the whole of what the query returns, and the friendly name is derived from
    # it in Rust.
    "system.App.id",
    # The Ask facet that offers "which app touched this" reads the app's NAME
    # beside its id (`MATCH (f:File)-[:ACCESSED_BY]->(a:App) RETURN a.id, a.name`,
    # lib.rs), and the project facet returns root_path and filters on expired_at
    # to keep archived projects out. Found by the grant-versus-query gate rather
    # than by hand: my own reading of this profile had called them covered.
    "system.App.name",
    "system.Project.root_path",
    "system.Project.expired_at",
]

# Event-bus scopes, for the shadow-to-enforce cutover the bus is parked halfway
# through (`ARLEN_EVENT_BUS_ENFORCE`, off by default). In shadow an out-of-scope
# publish is only logged and every requested subscription is kept verbatim, so
# this section changes nothing today; under enforce a caller with no declared
# scope publishes nothing and subscribes to nothing, and the FM would go quiet.
#
# Each entry was read out of the source rather than guessed, because a wrong one
# is a denial that only appears after the flip:
#
#   file.opened            lib.rs:1260, on opening a file - the event the whole
#                          KG File/Project graph is built from.
#   app.menu.*             the topbar menu contract in os-sdk/src/menu.rs: the
#                          app publishes registered/unregistered as its menu
#                          appears and goes away, and subscribes to
#                          app.menu.action_invoked (lib.rs:2061) to hear the user
#                          picking one of its own items back.
#
# `app.menu.*` rather than the two names: pattern_matches treats a `.*` suffix as
# a prefix on a dot boundary, the two publishes and the one subscribe are the
# whole of that contract, and a third verb in it would otherwise be a silent
# denial in an app that had already been granted the family.
[event_bus]
publish = [
    "file.opened",
    "app.menu.*",
]
subscribe = [
    "app.menu.*",
]
