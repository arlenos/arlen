# The clock app's profile.
#
# The smallest profile in the tree, and deliberately: the app renders alarms and
# timers, and the authority to WAKE the machine is not its. That grant lives in
# `clockd.toml`, held by the daemon the app asks - so a compromised clock window
# cannot schedule a wake, it can only ask something that may.
#
# No graph scope: the app reads no knowledge graph. No filesystem grant: its own
# state and its webview data both land in the app directory the launcher always
# grants (`~/.local/share/arlen/apps/dev.arlen.clock`, reached as
# `$XDG_DATA_HOME/dev.arlen.clock`). No network.

[info]
app_id = "dev.arlen.clock"
tier = "first-party"

# Event-bus scopes for the shadow-to-enforce cutover (`ARLEN_EVENT_BUS_ENFORCE`,
# off by default).
#
# DECLARING IS WHAT BOUNDS A COMPONENT, not its tier: the event bus holds a
# consumer to its declared `subscribe` list whatever tier it is, and a component
# that declares NOTHING keeps the machine-wide view. This profile had no
# `[event_bus]` section at all, so under enforcement this window could have
# subscribed to anything on the bus - another app's activity, the graph's own
# traffic - which is reach it has no claim to.
#
# THE APP'S OWN CODE PUBLISHES NOTHING: there is no emitter in this app
# (checked, not assumed). What it does publish is the plugin's, below.
#
# The subscribe list is not this app's own code either. `sdk/tauri-plugin-shell`
# subscribes these two from inside every Tauri process for the toolbar and the
# shortcut dispatch, so omitting them would silently switch both off while the
# subscribe still returns Ok.
[event_bus]
publish = [
    # THE PLUGIN'S, NOT THIS APP'S. The frontend calls
    # `plugin:arlen-shell|menu_register`, and `sdk/tauri-plugin-shell` emits the
    # registration from inside this process - so grepping this app for an emitter
    # finds nothing, which is exactly the reading that left this empty while the
    # subscribe list below got the same fact right. Under enforcement an app
    # without it registers no menu, and its top-bar menu is simply absent.
    "app.menu.registered",
    # The pair the same helper emits on teardown. Nothing calls it yet; when
    # something does, the grant is already here rather than one boot behind.
    "app.menu.unregistered",
]
subscribe = [
    "app.toolbar.action_invoked",
    "app.shortcut.action_invoked",
    # The third of the plugin's topics, added 9 September. An app publishes its
    # top-bar menu through the same plugin and the shell pushes the click back as
    # `app.menu.action_invoked`; nothing relayed it into the webview, so eleven
    # apps listened for a menu action that never arrived and their menus were
    # drawn and inert. The relay now lives in the plugin, which makes this grant a
    # consequence of linking it rather than a choice.
    "app.menu.action_invoked",
]
