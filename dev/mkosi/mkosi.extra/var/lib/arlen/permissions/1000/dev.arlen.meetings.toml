# The meetings app's profile.
#
# Still empty of grants, but NOT for the reason this file used to give. It said
# the surfaces render from a labelled sample and that nothing reads the graph.
# Both were true when it was written and neither is now: `meetings_list` and
# `meeting_note` read the knowledge graph through the os-sdk client, and the app
# writes notes back.
#
# THE ABSENT `[graph]` SECTION IS STILL CORRECT, and the reason is worth writing
# down so nobody adds a scope to be helpful. The daemon's meeting op (`0x0C`) is
# admitted by an APP-ID ALLOWLIST (`meeting_caller_admitted`), not by the read
# scope in a profile - so a `[graph]` section here would grant nothing, deny
# nothing, and mislead the next reader about how that op is gated. If the
# allowlist is ever replaced by scope-based admission, this is the file that has
# to change on the same day.
#
# The note document is app-owned and lands in the app's own directory, which the
# launcher always grants, so it needs no filesystem section either.
#
# NOT REACHED TODAY, and the one to watch: on-device capture. Both
# `meeting_start_capture` and `meeting_stop_capture` return "requires the ASR
# engine (not yet provisioned)", so no microphone is opened by this app at all.
# The day that engine lands, a meeting recorder becomes an app that listens to a
# room, and the grant for it is decided then - against a feature that exists,
# with a surface that says when it is on.

[info]
app_id = "dev.arlen.meetings"
tier = "first-party"

# Event-bus scopes for the shadow-to-enforce cutover (`ARLEN_EVENT_BUS_ENFORCE`,
# off by default).
#
# DECLARING IS WHAT BOUNDS A COMPONENT, not its tier: the event bus holds a
# consumer to its declared `subscribe` list whatever tier it is, and a component
# that declares NOTHING keeps the machine-wide view. This profile had no
# `[event_bus]` section at all, so under enforcement this window could have
# subscribed to anything on the bus - another app's activity, the graph's own
# traffic - which is reach it has no claim to.
#
# THE APP'S OWN CODE PUBLISHES NOTHING: there is no emitter in this app
# (checked, not assumed). What it does publish is the plugin's, below.
#
# The subscribe list is not this app's own code either. `sdk/tauri-plugin-shell`
# subscribes these two from inside every Tauri process for the toolbar and the
# shortcut dispatch, so omitting them would silently switch both off while the
# subscribe still returns Ok.
[event_bus]
publish = [
    # THE PLUGIN'S, NOT THIS APP'S. The frontend calls
    # `plugin:arlen-shell|menu_register`, and `sdk/tauri-plugin-shell` emits the
    # registration from inside this process - so grepping this app for an emitter
    # finds nothing, which is exactly the reading that left this empty while the
    # subscribe list below got the same fact right. Under enforcement an app
    # without it registers no menu, and its top-bar menu is simply absent.
    "app.menu.registered",
    # The pair the same helper emits on teardown. Nothing calls it yet; when
    # something does, the grant is already here rather than one boot behind.
    "app.menu.unregistered",

    # WHAT THIS WINDOW TELLS THE KNOWLEDGE GRAPH ABOUT ITSELF, in the same change
    # as the code that publishes it - never after. It writes into the graph, and
    # a graph input a person cannot see or switch off is the thing this system
    # exists not to build. Revoking these two lines is how somebody turns it off.
    #
    #   presence.set   - `meeting`, the meeting this capture will become (the
    #                    app's own word `live` until the graph files it), and
    #                    whether TRANSCRIPTION was running, while a microphone is
    #                    on and the window has focus
    #   presence.clear - when the capture ends or the surface goes away
    #
    # THE ONE A SENSOR COMES LEAST CLOSE TO. Editing and reading at least sit on
    # top of an `openat` the kernel probe also saw; being in a meeting touches no
    # file at all, so without this an hour of somebody's day is missing from their
    # own history.
    #
    # NO `app.timeline.record`: the meeting itself is already filed into the graph
    # when the capture produces its note, and recording "a meeting happened" here
    # would be the same fact twice, once well and once thinly. What was missing is
    # the interval, which is what presence is.
    #
    # No transcript, no notes and no participant leave through this. Recording and
    # transcribing are different consents in this app, and the metadata says which
    # of the two was running rather than folding them together.
    "app.presence.set",
    "app.presence.clear",
]
subscribe = [
    "app.toolbar.action_invoked",
    "app.shortcut.action_invoked",
    # The third of the plugin's topics, added 9 September. An app publishes its
    # top-bar menu through the same plugin and the shell pushes the click back as
    # `app.menu.action_invoked`; nothing relayed it into the webview, so eleven
    # apps listened for a menu action that never arrived and their menus were
    # drawn and inert. The relay now lives in the plugin, which makes this grant a
    # consequence of linking it rather than a choice.
    "app.menu.action_invoked",
]
