# The terminal's KG read profile. The knowledge daemon (root, uid 0) resolves a
# caller's profile under /var/lib/arlen/permissions/<the user it applies to>/
# <app_id>.toml - 1000 here, not the reader's uid (decided 11 Aug, so that the
# root daemon and the user's own launcher resolve the same file); without one
# the terminal's project-picker read is denied (empty scope). app_id is the
# terminal's bundle identifier (dev.arlen.terminal, apps/terminal/src-tauri/
# tauri.conf.json); confirm it matches path_to_app_id of the installed binary.
#
# READ-ONLY and Project-only on purpose: the terminal issues exactly one graph
# read (apps/terminal/src-tauri/src/lib.rs:405 - `MATCH (p:Project) WHERE
# p.expired_at IS NULL RETURN p.id, p.name, p.root_path`, the active-project list
# for cd/picker). It reads no File data and never writes, so there is no File
# scope, no write, no relations. Erring narrow: a missing scope degrades the
# picker; an extra scope leaks.
# WHAT THIS PROFILE DOES NOT COVER, and here it is the whole app. Everything
# below is about a four-field Project read and three event-bus topics; the
# terminal's actual reach is a SHELL, in which a person runs whatever they like
# with their own uid - every file they can read, every file they can write. No
# section here expresses that, and none can: the model grants an app paths, not a
# child process the user drives.
#
# The consequence is worth stating before it bites. There is no `[filesystem]`
# section, so the day `shell.toml [launcher] confined` is turned on, a confined
# terminal gets the app's own directories and nothing else - a shell that cannot
# see the home directory of the person typing in it. That is not a bug in the
# launcher; it is this file being silent about a requirement. Whoever flips that
# switch decides what a terminal is granted, and this note is where to start.
#
# Left unwritten deliberately: a `home = true` here would widen reach on a file
# that nothing enforces yet, which is a grant made ahead of the decision that
# needs it.

[info]
app_id = "dev.arlen.terminal"
tier = "first-party"

[graph]
read = [
    "system.Project.id",
    "system.Project.name",
    "system.Project.root_path",
    "system.Project.expired_at",
]

# Event-bus scopes, for the shadow-to-enforce cutover (`ARLEN_EVENT_BUS_ENFORCE`,
# off by default). This app is first-party, NOT system tier, so it is held to
# this section the moment enforcement is on - and a caller with no declared
# scope keeps no subscription at all.
#
# What that costs here is not a degraded feature, it is an excluded person.
# xterm.js paints the grid on a canvas, which a screen reader cannot read at
# all; `screenReaderMode` makes it keep a hidden live-region mirror instead, and
# the terminal turns that on when it hears `accessibility.state`. Without this
# grant the subscription is FILTERED, not refused: the connection succeeds, the
# pattern is dropped, and the app waits on a receiver that never yields. From
# inside it looks exactly like a topic nobody publishes on, which is why the
# terminal now says so after 20s rather than sitting quiet.
#
# That was written as "exactly the one topic it consumes - the terminal handles
# no other bus event", which was checked against apps/terminal/src-tauri and is
# wrong anyway. `sdk/tauri-plugin-shell`, which this app links, subscribes
# `app.toolbar.action_invoked` and `app.shortcut.action_invoked` from inside the
# app's own process, so they arrive on this same connection under this same
# profile. Declaring a subscribe list is what makes an app enforceable at all
# (`exempt = is_system && !declares_subscribe`), so adding `accessibility.state`
# silently switched the plugin's two off with it - toolbar buttons and shortcuts,
# gone, in the same wait-forever way described above.
#
# Found on the knowledge app, where an enforce boot named both patterns out loud;
# the terminal has the identical defect and only escaped the log because the app
# was not launched on that boot.
#
# `publish` is empty by fact, not omission: there is no emitter anywhere in
# apps/terminal/src-tauri (checked, not assumed). It is a pure consumer.
[event_bus]
publish = [
    # The quick actions this app pushes into the shell's top bar. `topbar.ts`
    # calls `toolbar.setQuickActions`, and `os-sdk/src/toolbar.rs` carries that as
    # `app.toolbar.quick_actions` from THIS process - the emit is the terminal's
    # even though the buttons appear in the shell.
    #
    # This list was empty, which read as "emits nothing" and was true of the
    # terminal's own source: the call goes through the plugin binding, so nothing
    # in `src-tauri` names an event. Latent rather than broken today - the bus is
    # in shadow mode (`ARLEN_EVENT_BUS_ENFORCE`, off by default) - but at the
    # cutover the terminal's top-bar actions would stop appearing, with nothing
    # here to say why.
    "app.toolbar.quick_actions",
]
subscribe = [
    "accessibility.state",
    "app.toolbar.action_invoked",
    "app.shortcut.action_invoked",
    # The third of the plugin's topics, added 9 September. An app publishes its
    # top-bar menu through the same plugin and the shell pushes the click back as
    # `app.menu.action_invoked`; nothing relayed it into the webview, so eleven
    # apps listened for a menu action that never arrived and their menus were
    # drawn and inert. The relay now lives in the plugin, which makes this grant a
    # consequence of linking it rather than a choice.
    "app.menu.action_invoked",
]
