# The AI agent's executor go-live permission profile, baked at the knowledge
# daemon's system profile path: /var/lib/arlen/permissions/<the user it applies
# to>/<app_id>.toml - 1000 here, not the reading daemon's uid (decided 11 Aug;
# keying on the reader made the same profile appear at two paths depending on who
# asked). The root daemon acting for user 1000 and a same-uid reader resolve the
# one file (knowledge `permission::system_profile_path`, preferred by
# `load_tiered` over the ~/.config fallback). The agent resolves to app_id "ai-agent"
# (/usr/lib/arlen/libexec/arlen-ai-agent, identity rule 1) and connects cross-uid
# (it is a per-user service, uid 1000); the daemon serves it because it is
# FirstParty (the cross-uid serve gate), and reads this profile for the WRITE
# grant - FirstParty/system-anchoring lifts the read label gate but does NOT grant
# a relation, so without this the executor's FILE_PART_OF create is refused.
#
# This is the exact grant `seed_executor_profile_for` uses in the green
# dev/integration write+undo IT: read scope on File/Project, the single
# FILE_PART_OF relation, and instance_scope = "all" (both endpoints are
# system-owned nodes the agent does not own, so linking them needs the privileged
# all-instances scope, or the write socket refuses the relation as unanchored).
# The [info] block also lets the profile parse under ConnectionAuth (the agent
# connects to the audit daemon too).
# WHAT THE FOUR READ FIELDS DO NOT SAY: where their contents GO. This is the one
# component that takes what it read out of the graph and puts it in a prompt. A
# path and a project name leave this process for a model - through `ai-proxy`, to
# whatever provider `ai.toml` names, which may be on this machine and may not. No
# field in this model distinguishes "may read this" from "may read this and send
# it somewhere", and for every other principal here that difference never arises.
#
# The other half of the same point: the relation below is what the executor writes
# with, and it writes at all only under `[agent] executor_live`, which is off. So
# this file describes a capability held and not exercised - the right state for
# it, and not one a reader could infer from the grant.

[info]
app_id = "ai-agent"
tier = "first-party"

[graph]
read = [
    "system.File.id",
    "system.File.path",
    "system.Project.id",
    "system.Project.root_path",
]
relations = [
    { from = "system.File", to = "system.Project", type = "FILE_PART_OF" },
]
instance_scope = "all"
