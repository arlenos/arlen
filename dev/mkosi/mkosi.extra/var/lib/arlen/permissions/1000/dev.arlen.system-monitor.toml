# The system monitor's profile.
#
# It reads two kernel interfaces and writes nothing outside its own state. The
# graph is not among them: the Performance tab samples `/proc` directly rather
# than asking the knowledge daemon, so there is no `[graph]` section and no read
# scope to argue about.
#
# `/proc` needs no grant - the sandbox mounts a private procfs, which is where
# `stat`, `meminfo`, `diskstats` and `net/dev` come from.
#
# `/sys/block` does. It is the one `/sys` path this app touches: a name in
# `diskstats` is a whole disk exactly when `/sys/block/<name>` exists, which is
# how the kernel itself draws the line between a disk and its partitions.
# Counting both would double every byte.
#
# Read-only, and named as a subtree rather than as `/sys`: a writable `custom`
# grant of a whole-tree root is what the launcher drops by design, and this app
# has no reason to write there. Verified against a confined run - the subtree is
# readable, it is not writable, and `/sys` as a whole stays refused.

# WHAT THIS FILE CANNOT SAY, which matters more here than in any other app's
# profile. This one ENDS other processes (SIGTERM), FREEZES them (SIGSTOP /
# SIGCONT) and CHANGES THEIR PRIORITY - and the permission model has no field for
# any of that. `SystemPermissions` covers autostart, background and power actions;
# there is no "may signal another process". So a reviewer reading the grants below
# would conclude this app's reach is a read-only `/sys/block`, and would be wrong.
#
# The containment for those powers is the kernel's, not this file's: a process may
# only signal processes of its own uid, and raising a priority needs CAP_SYS_NICE,
# which an ordinary session does not have - the app is refused and says so, which
# `drive-system-monitor.sh` asserts. That is real containment, but it lives
# somewhere a reader of this file cannot see, so it is written here.
#
# If the model ever grows a way to express it, this comment is the specification:
# end, freeze and re-nice, same-uid only, no privilege escalation.

[info]
app_id = "dev.arlen.system-monitor"
tier = "first-party"

[filesystem]
read_only = ["/sys/block"]

# Event-bus scopes for the shadow-to-enforce cutover (`ARLEN_EVENT_BUS_ENFORCE`,
# off by default).
#
# DECLARING IS WHAT BOUNDS A COMPONENT, not its tier: the event bus holds a
# consumer to its declared `subscribe` list whatever tier it is, and a component
# that declares NOTHING keeps the machine-wide view. This profile had no
# `[event_bus]` section at all, so under enforcement this window could have
# subscribed to anything on the bus - another app's activity, the graph's own
# traffic - which is reach it has no claim to.
#
# NOTHING IS PUBLISHED: there is no emitter in this app (checked, not assumed).
#
# The subscribe list is not this app's own code either. `sdk/tauri-plugin-shell`
# subscribes these two from inside every Tauri process for the toolbar and the
# shortcut dispatch, so omitting them would silently switch both off while the
# subscribe still returns Ok.
[event_bus]
publish = []
subscribe = [
    "app.toolbar.action_invoked",
    "app.shortcut.action_invoked",
]
