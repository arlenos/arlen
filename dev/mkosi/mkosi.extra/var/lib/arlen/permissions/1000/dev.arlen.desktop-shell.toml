# The desktop-shell's KG read profile. It lives under the uid of the user it
# applies to - /var/lib/arlen/permissions/1000/<app_id>.toml - not under the uid
# of whoever reads it. That was decided on 11 Aug and this file moved with it: a
# profile describes an app, so one that appears or disappears depending on who
# asks is incoherent, and keying on the reader had the root knowledge daemon
# looking in /0/ while `arlen-run`, which runs as the user, looked in /1000/ and
# refused every confined launch. Root-owned and world-readable is what lets both
# readers agree on this file. Without one the shell's KG features (waypointer project search, Focus Mode, the per-app
# project association) are denied (empty scope). The app_id `desktop-shell` is the
# CONFIRMED canonical resolution: arlen-permissions identity.rs rule (2) maps
# /usr/bin/arlen-desktop-shell -> "desktop-shell" (its identity test asserts this),
# not the tauri bundle id dev.arlen.desktop-shell.
#
# READ-ONLY. Scope matched to the shell's actual cyphers (apps/desktop-shell/
# src-tauri/src/projects.rs): active/focused Projects (id/name/description/
# root_path/status), and the per-app association `MATCH (a:App)<-[:ACCESSED_BY]-
# (f:File)-[:FILE_PART_OF]->(p:Project)`. The traversal references the App and File
# labels (even though it returns only Project fields + a File count), and the
# read-label gate admits a traversal only when every referenced node label is in
# the readable set, so App.id and File.id are granted for the traversal. No write,
# no relations. Erring narrow; confirm the exact readable-label/rel-type gate
# semantics if a query is unexpectedly refused.
[info]
app_id = "dev.arlen.desktop-shell"
tier = "first-party"

[graph]
read = [
    "system.Project.id",
    "system.Project.name",
    "system.Project.description",
    "system.Project.root_path",
    "system.Project.status",
    # The project list returns the whole card, not just its identity
    # (`projects.rs:299-302`): accent colour and icon for the chip, created_at
    # and last_accessed for ordering, and the inferred/confidence/promoted trio
    # that decides whether a detected project is shown as a suggestion. Seven
    # fields the profile did not name, all in one query.
    "system.Project.accent_color",
    "system.Project.icon",
    "system.Project.created_at",
    "system.Project.last_accessed",
    "system.Project.inferred",
    "system.Project.confidence",
    "system.Project.promoted",
    "system.App.id",
    "system.File.id",
    # The three fields the shell's file surfaces actually read, added on
    # 11 Aug after checking the grants against the queries rather than the
    # other way round. `recent_files.rs:117` returns path and last_accessed
    # and filters on last_accessed; the Waypointer file plugin
    # (`plugins/files.rs:230`) returns path, app_id and last_accessed.
    #
    # Inert today and added anyway: `dev.arlen.desktop-shell` is in the
    # first-party set, so `tier_for_app` makes it system-anchored and the
    # read-scope gate does not apply to it at all - which is precisely why
    # the omission never showed up as a broken Recent Files. A profile that
    # does not describe what its app reads is a trap for whoever tightens
    # that anchoring, and the shape of the breakage would be a list that is
    # silently empty rather than an error.
    "system.File.path",
    "system.File.last_accessed",
    "system.File.app_id",
    # `knowledge_daily_counts` reads raw event timestamps for the activity strip
    # (knowledge.rs:87). Without this the query is denied and the function falls
    # to `empty_response()`, so the strip renders a flat week - it says the user
    # did nothing rather than that it was not allowed to look. Only the
    # timestamp: the counts are bucketed in Rust and no other Event field is
    # read.
    "system.Event.timestamp",
]

# Event-bus scopes, for the shadow-to-enforce cutover (`ARLEN_EVENT_BUS_ENFORCE`,
# off by default). Under enforce a caller with no declared scope keeps no
# subscription at all, and for this app that is the whole top bar going dark:
# window titles, workspace state, the app menu, toolbars, badges and the battery.
#
# The list is not a reading of the call sites, it is the SUBSCRIPTIONS constant
# the shell registers with (`event_bus.rs:23`), translated into the profile's
# pattern syntax. The two spell the same idea differently and the difference is
# worth knowing: the bus registration uses a trailing-dot prefix (`window.`),
# while a profile pattern uses a `.*` suffix (`window.*`) that pattern_matches
# strips and compares on the dot boundary. Both admit `window.focused`; neither
# admits `windowless.x`.
#
# Families rather than the 22 concrete types the file handles today. Each of
# these is one contract with its own producer - the toolbar protocol, the
# shortcut registry, the badge and ambient channels - and the shell handles every
# verb in them by construction, since it IS the renderer they exist for. Naming
# the 22 would mean a new verb in an existing contract arrives as a silent
# denial, which is exactly the failure this whole section is meant to prevent.
#
# `publish` was empty, with a note saying the shell holds no UnixEventEmitter
# anywhere in its tree - which is TRUE and led to the wrong conclusion. The shell
# does not use the SDK emitter; it writes to ARLEN_PRODUCER_SOCKET through two
# hand-rolled helpers (`projects::emit_to_event_bus`, `event_bus::emit_event`),
# and it publishes nine topics that way. Looking for the type missed the
# behaviour.
#
# INERT TODAY, and written out anyway. The bus takes tier from the peer's exe
# path, not from this file's `tier` field, and apps install under
# /usr/lib/arlen/apps/<id>/bin/ - which `detect_tier` calls System, and a system
# producer is exempt from the publish gate entirely. So an empty list was never
# going to drop anything.
#
# It is here because the exemption rests on an install path rather than on
# intent. If apps ever move, or the tier rule tightens, an empty list would
# silently drop nine things at once - a denied publish is dropped with nothing
# said to the producer, so the audio and network indicators would stop updating,
# Focus Mode would stop suppressing notifications, app.* dispatch would stop
# arriving, and the terminal's screen-reader mirror would never switch on, all
# while the emitting code looked like it worked.
#
# Read out of the source now rather than believed:
# `dev/scripts/check-subscribe-scope.py` compares this list against what the
# shell actually emits, so the next topic added to either side has to be added to
# both.
[event_bus]
publish = [
    # System state the shell owns and republishes for apps (SST-R2).
    "audio.state",
    "network.state",
    "accessibility.state",
    # Focus Mode, consumed by the notification daemon to suppress by app.
    "focus.activated",
    "focus.deactivated",
    # Action dispatch: the shell renders these surfaces, so it is where the
    # user's click becomes an event the owning app hears.
    "app.menu.action_invoked",
    "app.toolbar.action_invoked",
    "app.shortcut.action_invoked",
    "app.intent.dispatched",
]
subscribe = [
    "window.*",
    "config.*",
    "project.*",
    "app.toolbar.*",
    "app.shortcut.*",
    "app.badge.*",
    "app.ambient.*",
    "app.menu.*",
    "power.*",
]
