# The dogfood driver's bus scope.
#
# `arlen-dogfood` ships beside `arlen-event-emit` (build phase 09-dogfood,
# /usr/bin, so identity rule (2) resolves it to `dogfood`) and emits the same
# synthetic file-open to walk the KG pipeline. Same reasoning as its sibling: no
# profile means no declared scope, and an ungranted publish is dropped rather than
# refused, so the driver would report progress against a bus that received
# nothing.
[info]
app_id = "dogfood"

[event_bus]
publish = ["file.opened"]
subscribe = []
