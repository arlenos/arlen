# The dogfood probe's event-bus profile.
#
# `dev/dogfood` is the verify-image probe that emits a synthetic `file.opened`
# so a boot can prove the whole ingestion path end to end: bus -> writer ->
# SQLite -> promotion -> graph.
#
# IT IS ON THE IMAGE, which this file used to deny. Build phase 09-dogfood stages
# it at /usr/bin/arlen-dogfood, so identity rule (2) resolves it to `dogfood` and
# this profile is looked up for real rather than sitting harmless beside a binary
# nobody installed. Checked on 14 September against the build phase and the
# resolver, after its sibling `arlen-event-emit` turned out to ship the same way
# with no profile at all.
#
# It needs a declaration for the same reason the audit daemon does: publish
# exemption is now a named property of the components that originate system
# events, and a probe is not one of those - it imitates one. Without this its
# event is dropped at the bus and the probe reports the pipeline broken, which
# would be a false alarm about the thing the probe exists to measure.
#
# One topic, checked against the source rather than assumed.
[info]
app_id = "dogfood"
tier = "first-party"

[event_bus]
publish = ["file.opened"]

# A pure producer: the probe emits one event and reads nothing.
subscribe = []
