# The module runtime's event-bus profile.
#
# THIS IS THE OUTER BOUND ON A CONFUSED DEPUTY, which is why it is narrow. Every
# other daemon's profile lists what that daemon itself sends; modulesd sends
# whatever a hosted module asks it to. `runtime/host_bindings.rs:80` passes a
# module-supplied `event_type` straight to the shared emitter, gated only by that
# module's own declared `event_bus.publish` prefixes
# (`host/events.rs::check_publish`).
#
# That inner gate reads the module's manifest, and a manifest is written by
# whoever wrote the module. So it decides which of the runtime's authority a
# module may use; it cannot bound the runtime's authority itself. This file does.
# With `module.*` alone, a module that declares `publish = ["power."]` in its
# manifest passes its own check and is still refused at the bus - it cannot use
# the runtime as a route to speak as the power daemon.
#
# `module.*` because that is the namespace the module system owns by convention
# (`host/events.rs` documents `module.com.example.` as the shape) and the one no
# first-party component publishes into.
#
# SUBSCRIBE IS EMPTY, AND THAT IS A DECISION WITH A COST. No module ships on this
# image, so nothing is dropped today. But an ungranted subscribe pattern is
# FILTERED rather than refused - the connection succeeds and the events simply
# never arrive - so the day a module ships declaring `subscribe = ["focus."]`,
# its own gate will pass, the bus will quietly deliver nothing, and the module
# will look broken rather than unauthorised. Whoever ships the first module with
# an event_bus capability has to widen this file in the same change. Starting
# narrow makes that a deliberate widening; starting wide would have made it an
# accident nobody noticed.
# NO `[graph]` SECTION, and for the same reason as the empty subscribe list. The
# runtime carries a graph host import (`host/graph.rs`), so a Tier 1 module can
# ask it to query the knowledge graph, and that request reaches the daemon as
# `modulesd` rather than as the module. With no read scope here the daemon denies
# it, which is correct while no module ships and wrong the moment one does - the
# module's own manifest capability will pass and the read will come back refused,
# so it will look broken rather than unauthorised.
#
# Whoever ships the first module with a graph capability sets the outer bound
# here, and should set it from that module's queries rather than from a category:
# see the timeline's profile, whose grant is exactly the seven questions its views
# ask.
#
# AND THE THIRD HOST IMPORT HAS NO FIELD HERE AT ALL: the runtime FETCHES. A
# Tier 1 module calls `network.fetch` and `host/network.rs` makes the request, so
# every byte leaves the machine as `modulesd` and not as the module. That path
# carries its own defences - https only, the module's declared domains, per-hop
# redirect re-validation against the SSRF guard, a size cap and a timeout - and
# every one of them is inside that file rather than in this one. The outer bound
# that this profile is for, the one a module's own manifest cannot widen, does
# not exist for egress: there is no `[network]` section in the profile model that
# a runtime could be held to.
#
# Nothing is dropped today because no module ships. Recorded because the two
# sections above bound the bus and the graph on exactly this reasoning, and a
# reader who takes the pattern to mean the runtime is bounded everywhere would be
# wrong about the axis that reaches off the machine.
[info]
app_id = "modulesd"
tier = "first-party"

[event_bus]
publish = ["module.*"]
subscribe = []
