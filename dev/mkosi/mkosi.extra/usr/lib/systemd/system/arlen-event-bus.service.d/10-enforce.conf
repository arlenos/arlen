# Publish and subscribe scopes ENFORCED, not shadowed.
#
# The condition for this was populate-then-flip fail-closed (D3): flip once the
# declarations are populated and a boot shows no denials. A 12 Aug verify boot met
# it - zero denials, with the compositor, the shell and the knowledge daemon all
# inside what they had written down.
#
# The reason to flip rather than wait: an unenforced control is worse than a
# visible denial. Shadowed, the isolation the paper describes is enforced nowhere
# a user will ever run. A denial logs its component and its topic and is one line
# of declaration away from fixed, which is a recoverable failure mode and the one
# the design was built to have.
#
# WHAT THE GREEN COVERS, precisely, because "zero denials" is true of what ran:
#
#   exempt by silence  every shipped binary is under /usr/bin/arlen- or
#                      /usr/lib/arlen/, so detect_tier places it System: publish is
#                      unrestricted, and subscribe is unrestricted UNLESS the
#                      component declares a list. Most declare nothing and are
#                      unaffected by this switch entirely.
#   declared, and run  the compositor (subscribe = [], so bounded to nothing), the
#                      desktop shell and the knowledge daemon. All three start on a
#                      verify boot and produced no denial.
#   declared, not run  `dev.arlen.files`. It publishes `file.opened` and
#                      `app.menu.*` and declares exactly those; its declared
#                      subscribe (`app.menu.*`) is not exercised, because its code
#                      only publishes. Covered by `check-bus-declarations.py`
#                      reading the profile, not by a boot starting the app.
#   not covered        a caller that is neither system-tier nor declared - a
#                      third-party app, or a binary run from a dev tree. That is
#                      the case the scopes exist for and the one this flip bites.
#                      Nothing on the image is in it today.

[Service]
Environment=ARLEN_EVENT_BUS_ENFORCE=1
