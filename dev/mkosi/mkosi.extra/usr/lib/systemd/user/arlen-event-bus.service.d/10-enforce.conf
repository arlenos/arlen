# Publish and subscribe scopes ENFORCED on the session bus, not shadowed.
#
# The reasons, and what a green boot does and does not cover, are written once in
# `system/arlen-event-bus-system.service.d/10-enforce.conf`. A drop-in applies to
# the unit of its own name in its own scope, so the session bus needs this file
# as well as that one: one switch per unit.

[Service]
Environment=ARLEN_EVENT_BUS_ENFORCE=1
